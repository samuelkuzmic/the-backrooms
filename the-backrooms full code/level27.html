<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 27 - The Woodrooms</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a0f00; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffcc00; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 27: THE WOODROOMS<br>OBJECTIVE: FIND THE GOLDEN KEY</div>
    <div id="death">CONSUMED BY THE WINDOW</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0f00);
        scene.fog = new THREE.Fog(0x1a0f00, 1, 400);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isEnding = false;
        let hasKey = false;
        const walls = [];

        // PROCEDURAL WOOD TEXTURE
        const woodCanvas = document.createElement('canvas');
        woodCanvas.width = 256; woodCanvas.height = 256;
        const ctx = woodCanvas.getContext('2d');
        ctx.fillStyle = '#3d2511'; ctx.fillRect(0, 0, 256, 256);
        for(let i=0; i<150; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#4e2f16' : '#2b1a0a';
            ctx.fillRect(Math.random()*256, 0, Math.random()*3, 256);
        }
        const woodTex = new THREE.CanvasTexture(woodCanvas);
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

        const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6e462a, roughness: 0.3 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00, roughness: 0.9 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.2 });

        // GROUND AND ROOF
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1300, 1300), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(1300, 1300), woodMat);
        ceiling.position.y = 35;
        ceiling.rotation.x = Math.PI / 2;
        scene.add(ceiling);

        function createWall(x, z, w, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 35, d), woodMat);
            wall.position.set(x, 17.5, z);
            scene.add(wall);
            walls.push(new THREE.Box3().setFromObject(wall));
        }

        // --- OUTER PERIMETER WALLS ---
        createWall(0, 650, 1300, 15);  // North
        createWall(0, -650, 1300, 15); // South
        createWall(650, 0, 15, 1300);  // East
        createWall(-650, 0, 15, 1300); // West

        // --- INTERIOR ROOMS ---
        for(let i = -6; i <= 6; i++) {
            for(let j = -6; j <= 6; j++) {
                if(Math.abs(i) < 1 && Math.abs(j) < 1) continue;
                if(Math.random() > 0.6) createWall(i*100, j*100 - 50, 100, 10);
                if(Math.random() > 0.6) createWall(i*100 - 50, j*100, 10, 100);
            }
        }

        // SPAWNING HELPERS
        function findSafePos() {
            let pos = new THREE.Vector3();
            let attempts = 0;
            while(attempts < 100) {
                pos.set((Math.random()-0.5)*1100, 8, (Math.random()-0.5)*1100);
                let testBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(20, 20, 20));
                let hit = false;
                for(let w of walls) if(testBox.intersectsBox(w)) hit = true;
                if(!hit) return pos;
                attempts++;
            }
            return new THREE.Vector3(50, 8, 50);
        }

        // KEY
        const key = new THREE.Mesh(new THREE.TorusGeometry(2, 0.6, 12, 24), goldMat);
        const kPos = findSafePos();
        key.position.copy(kPos);
        scene.add(key);
        const kLight = new THREE.PointLight(0xffcc00, 300, 80);
        kLight.position.copy(kPos);
        scene.add(kLight);

        // DOOR
        const doorGroup = new THREE.Group();
        doorGroup.add(new THREE.Mesh(new THREE.BoxGeometry(16, 28, 4), woodMat));
        const handle = new THREE.Mesh(new THREE.SphereGeometry(1.2), goldMat);
        handle.position.set(5, 0, 2.5);
        doorGroup.add(handle);
        const dPos = findSafePos();
        doorGroup.position.copy(dPos);
        doorGroup.position.y = 14;
        scene.add(doorGroup);
        const doorLight = new THREE.PointLight(0xffaa44, 0, 60);
        doorLight.position.set(dPos.x, 14, dPos.z + 5);
        scene.add(doorLight);

        // ENTITY
        const monster = new THREE.Mesh(new THREE.PlaneGeometry(15, 22), new THREE.MeshBasicMaterial({color:0x000000, side:2}));
        monster.position.copy(findSafePos());
        scene.add(monster);

        // SETUP
        scene.add(new THREE.AmbientLight(0x2b1a0a, 0.7));
        const torch = new THREE.PointLight(0xffaa44, 400, 150);
        camera.add(torch);
        scene.add(camera);
        camera.position.set(0, 14, 0);

        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(6, 6, 6));
            for(let b of walls) if(pBox.intersectsBox(b)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0; dir.normalize().multiplyScalar(keys.ShiftLeft ? 3.5 : 2.0);
                const nX = camera.position.clone().add(new THREE.Vector3(dir.x, 0, 0));
                if (!checkCollision(nX)) camera.position.x = nX.x;
                const nZ = camera.position.clone().add(new THREE.Vector3(0, 0, dir.z));
                if (!checkCollision(nZ)) camera.position.z = nZ.z;
            }

            key.rotation.y += 0.05;
            if (camera.position.distanceTo(key.position) < 12 && !hasKey) {
                hasKey = true; key.visible = false; kLight.visible = false;
                doorLight.intensity = 500;
                document.getElementById('ui').innerHTML = "LEVEL 27: KEY OBTAINED<br>OBJECTIVE: LOCATE THE OAK DOOR";
            }

            if (hasKey && camera.position.distanceTo(doorGroup.position) < 18) {
                isEnding = true;
                window.location.href = "level28.html";
            }

            const mDist = monster.position.distanceTo(camera.position);
            if (mDist < 450) {
                monster.position.add(new THREE.Vector3().subVectors(camera.position, monster.position).normalize().multiplyScalar(1.5));
                monster.lookAt(camera.position.x, 12, camera.position.z);
            }
            if (mDist < 15) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
