<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Backrooms - Level 9</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffffff; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; font-weight: bold;
            text-shadow: 2px 2px #000;
        }
        #death {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: #f00; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 9 - THE SUBURBS<br>GENERATORS: <span id="count">0</span>/5</div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010205);
        scene.fog = new THREE.Fog(0x010205, 1, 400); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let tanksFound = 0;
        let isDead = false;
        const collidables = [];
        const tanks = [];
        const monsters = [];
        const houseLocations = [];

        scene.add(new THREE.AmbientLight(0x222233, 0.4));
        const flashLight = new THREE.SpotLight(0xffffff, 6000, 1000, 0.4);
        scene.add(flashLight);
        scene.add(flashLight.target);

        // --- DETAILED LINED WOOD TEXTURE ---
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2b1d12'; ctx.fillRect(0,0,128,128);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
        for(let i=0; i<128; i+=8) { // Create horizontal siding lines
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
        }
        const woodTex = new THREE.CanvasTexture(canvas);
        const woodMat = new THREE.MeshStandardMaterial({ map: woodTex });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
        const beaconMat = new THREE.SpriteMaterial({ color: 0xffffff, fog: false, depthTest: false });

        function addWall(w, h, d, x, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodMat);
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
            const box = new THREE.Box3().setFromObject(mesh);
            collidables.push(box);
        }

        function buildHouse(x, z, side) {
            if (Math.abs(z) < 65) return; 

            const h = 18; const s = 20; const t = 2;
            const houseX = side === 'left' ? x - 10 : x + 10;

            // Store for generator randomization
            houseLocations.push({x: houseX, z: z});

            // Geometry (Facing the road)
            addWall(t, h, s, side === 'left' ? x - 20 : x + 20, z); // Back
            addWall(s, h, t, houseX, z - 10); // Side
            addWall(s, h, t, houseX, z + 10); // Side
            addWall(t, h, 7, x, z - 6.5); // Front L
            addWall(t, h, 7, x, z + 6.5); // Front R

            // Roof
            const roof = new THREE.Mesh(new THREE.ConeGeometry(16, 10, 4), roofMat);
            roof.position.set(houseX, h + 5, z);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);

            // Monster
            const mon = new THREE.Mesh(new THREE.CapsuleGeometry(0.7, 2.5, 4, 8), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true}));
            mon.position.set(houseX, 4, z);
            mon.userData = { chasing: false };
            scene.add(mon);
            monsters.push(mon);
        }

        // --- UPDATED GREEN FLOOR ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 5000), new THREE.MeshStandardMaterial({color: 0x0a1a05}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // Dense spawn
        for (let i = -50; i <= 50; i++) {
            buildHouse(-15, i * 25, 'left');
            buildHouse(15, i * 25, 'right');
        }

        // --- RANDOM GENERATOR SPAWNING ---
        const shuffled = houseLocations.sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 5);
        selected.forEach(pos => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 3), new THREE.MeshStandardMaterial({color: 0x333}));
            mesh.position.set(pos.x, 2.5, pos.z);
            scene.add(mesh);
            const beacon = new THREE.Sprite(beaconMat);
            beacon.scale.set(6, 6, 1);
            beacon.position.set(pos.x, 10, pos.z);
            scene.add(beacon);
            tanks.push({mesh, beacon});
        });

        camera.position.set(0, 7, 0); 
        const keys = {};
        let yaw = 0, pitch = 0;
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.4, Math.min(1.4, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        const pBox = new THREE.Box3();
        const pSize = new THREE.Vector3(3, 7, 3);

        function animate() {
            requestAnimationFrame(animate);
            if (isDead) return;

            const speed = keys.ShiftLeft ? 1.2 : 0.45;
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;

            if (move.length() > 0) {
                move.applyQuaternion(camera.quaternion);
                move.y = 0; move.normalize().multiplyScalar(speed);
                const oldX = camera.position.x; const oldZ = camera.position.z;
                
                camera.position.x += move.x;
                pBox.setFromCenterAndSize(camera.position, pSize);
                for(let b of collidables) if(pBox.intersectsBox(b)) camera.position.x = oldX;

                camera.position.z += move.z;
                pBox.setFromCenterAndSize(camera.position, pSize);
                for(let b of collidables) if(pBox.intersectsBox(b)) camera.position.z = oldZ;
            }

            flashLight.position.copy(camera.position);
            const tDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            flashLight.target.position.copy(camera.position).add(tDir);

            tanks.forEach(t => {
                if (t.mesh.visible && camera.position.distanceTo(t.mesh.position) < 10) {
                    t.mesh.visible = false; t.beacon.visible = false;
                    tanksFound++; document.getElementById('count').innerText = tanksFound;
                    if(tanksFound >= 5) { 
                        isDead = true; 
                        window.location.href = "level10.html"; 
                    }
                }
            });

            monsters.forEach(m => {
                const d = camera.position.distanceTo(m.position);
                if (keys.ShiftLeft && d < 180) m.userData.chasing = true;
                if (m.userData.chasing) {
                    m.position.addScaledVector(new THREE.Vector3().subVectors(camera.position, m.position).normalize(), 0.85);
                }
                if (d < 6) {
                    isDead = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
