<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 30 - Aquatic Cubes</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000a0a; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #00ffff; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #00ffff; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 30: AQUATIC CUBES<br>TRAPPED. FIND THE HATCH BEFORE THE LURKER FINDS YOU.</div>
    <div id="death">CONSUMED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000a0a); 
        scene.fog = new THREE.Fog(0x000a0a, 1, 900);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isEnding = false;
        const walls = [];

        // --- MATERIALS ---
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x002222, roughness: 0 });
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0x006666, metalness: 0.6, roughness: 0.2 });
        const borderMat = new THREE.MeshStandardMaterial({ color: 0x001111, transparent: true, opacity: 0.5 });

        // --- THE BOXED PERIMETER ---
        const worldSize = 2500;
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, worldSize), waterMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function createBoundary(x, z, w, d) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, 800, d), borderMat);
            b.position.set(x, 400, z);
            scene.add(b);
            walls.push(new THREE.Box3().setFromObject(b));
        }
        createBoundary(0, 1250, 2500, 20);  createBoundary(0, -1250, 2500, 20);
        createBoundary(1250, 0, 20, 2500);  createBoundary(-1250, 0, 20, 2500);

        // --- AQUATIC CUBES ---
        for(let i = 0; i < 25; i++) {
            const size = 100 + Math.random() * 150;
            const h = 300 + Math.random() * 400;
            const x = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            if (Math.abs(x) < 150 && Math.abs(z) < 150) continue; // Clear spawn

            const cube = new THREE.Mesh(new THREE.BoxGeometry(size, h, size), cubeMat);
            cube.position.set(x, h/2 - 20, z);
            scene.add(cube);
            walls.push(new THREE.Box3().setFromObject(cube));
        }

        // --- THE EXIT HATCH ---
        const exitPos = new THREE.Vector3((Math.random()-0.5)*2000, 2, (Math.random()-0.5)*2000);
        const hatch = new THREE.Mesh(new THREE.CylinderGeometry(25, 25, 6, 32), new THREE.MeshStandardMaterial({color: 0x111111}));
        hatch.position.copy(exitPos);
        const hatchLight = new THREE.PointLight(0x00ffff, 1500, 200);
        hatchLight.position.set(exitPos.x, 20, exitPos.z);
        scene.add(hatch, hatchLight);

        // --- THE TRENCH LURKER (MONSTER) ---
        const monster = new THREE.Group();
        const mBody = new THREE.Mesh(new THREE.OctahedronGeometry(15), new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true}));
        const mCore = new THREE.Mesh(new THREE.SphereGeometry(6), new THREE.MeshBasicMaterial({color: 0x00ffff}));
        const mLight = new THREE.PointLight(0x00ffff, 1000, 200);
        monster.add(mBody, mCore, mLight);
        monster.position.set(1000, 25, 1000);
        scene.add(monster);

        // --- LIGHTING ---
        scene.add(new THREE.AmbientLight(0x00ffff, 0.2));
        const headlamp = new THREE.PointLight(0x00ffff, 100, 200);
        camera.add(headlamp);
        scene.add(camera);

        camera.position.set(0, 20, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(15, 15, 15));
            for(let wall of walls) if(pBox.intersectsBox(wall)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            // Movement Logic (Sliding Mechanic)
            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0; 
                dir.normalize().multiplyScalar(keys.ShiftLeft ? 10.0 : 4.5);
                
                const tX = camera.position.clone().add(new THREE.Vector3(dir.x, 0, 0));
                if (!checkCollision(tX)) camera.position.x = tX.x;
                const tZ = camera.position.clone().add(new THREE.Vector3(0, 0, dir.z));
                if (!checkCollision(tZ)) camera.position.z = tZ.z;
            }

            // Exit Check
            if (camera.position.distanceTo(exitPos) < 40) {
                isEnding = true;
                window.location.href = "level31.html";
            }

            // MONSTER AI (SPEED 4.0 - Persistent Stalker)
            const mDist = monster.position.distanceTo(camera.position);
            if (mDist < 3000) {
                const mMove = new THREE.Vector3().subVectors(camera.position, monster.position).normalize().multiplyScalar(4.0);
                monster.position.add(mMove);
                monster.position.y = 25 + Math.sin(Date.now() * 0.003) * 10;
                monster.rotation.y += 0.05;
            }
            if (mDist < 25) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
