<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 188 - Extra Row</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #000; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; 
            text-shadow: 1px 1px #fff; line-height: 1.2;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 188<br>GET TO THE END OF THE HALL</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); 
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1.0, 30000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 6);
        scene.add(light);

        const carpet = new THREE.MeshStandardMaterial({ color: 0x5a5440 });
        const beigeWall = new THREE.MeshStandardMaterial({ color: 0xd9c5a0 }); 
        const courtWallMat = new THREE.MeshStandardMaterial({ color: 0x666666 }); 
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3d4d2a });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const winLit = new THREE.MeshBasicMaterial({ color: 0xfff4c0 });
        const winDark = new THREE.MeshBasicMaterial({ color: 0x050505 });

        // --- ENCLOSED HALLWAY ---
        const hallW = 400, hallH = 150, hallL = 10000;
        const f = new THREE.Mesh(new THREE.PlaneGeometry(hallW, hallL), carpet);
        f.rotation.x = -Math.PI/2; scene.add(f);
        const r = new THREE.Mesh(new THREE.PlaneGeometry(hallW, hallL), roofMat);
        r.rotation.x = Math.PI/2; r.position.y = hallH; scene.add(r);
        
        const rw = new THREE.Mesh(new THREE.BoxGeometry(20, hallH, hallL), beigeWall);
        rw.position.set(hallW/2, hallH/2, 0); scene.add(rw);
        const lw1 = new THREE.Mesh(new THREE.BoxGeometry(20, hallH, 4400), beigeWall);
        lw1.position.set(-hallW/2, hallH/2, -2800); scene.add(lw1);
        const lw2 = new THREE.Mesh(new THREE.BoxGeometry(20, hallH, 4400), beigeWall);
        lw2.position.set(-hallW/2, hallH/2, 2800); scene.add(lw2);

        const startWall = new THREE.Mesh(new THREE.BoxGeometry(hallW, hallH, 20), beigeWall);
        startWall.position.set(0, hallH/2, 5000); scene.add(startWall);
        const endWall = new THREE.Mesh(new THREE.BoxGeometry(hallW, hallH, 20), beigeWall);
        endWall.position.set(0, hallH/2, -5000); scene.add(endWall);

        // --- COURTYARD SETTINGS ---
        const courtS = 12000;
        const grassY = -2200;   
        const ceilingY = 450;   

        const gr = new THREE.Mesh(new THREE.PlaneGeometry(courtS, courtS), grassMat);
        gr.rotation.x = -Math.PI/2; gr.position.set(-6200, grassY, 0);
        scene.add(gr);

        function makeBuilding(x, z, rot) {
            const group = new THREE.Group();
            const bodyH = 6000;
            const body = new THREE.Mesh(new THREE.BoxGeometry(courtS, bodyH, 10), courtWallMat);
            body.position.y = (ceilingY + grassY) / 2;
            group.add(body);

            const winW = 850, winH = 450; 
            const startX = -courtS / 2 + 700;
            const stepX = 1300; 
            const stepY = 850;  
            const startY = grassY + 400; 

            // Loop adjusted for that extra row "above"
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 14; j++) { // Increased row count
                    const posX = startX + (i * stepX);
                    const posY = startY + (j * stepY);
                    
                    // Windows only spawn if they are visible
                    if (posY < ceilingY + 350) {
                        const isLit = Math.random() < 0.15;
                        const win = new THREE.Mesh(new THREE.PlaneGeometry(winW, winH), isLit ? winLit : winDark);
                        win.position.set(posX, posY, 25); 
                        group.add(win);
                    }
                }
            }

            const cr = new THREE.Mesh(new THREE.PlaneGeometry(courtS, 12000), roofMat);
            cr.rotation.x = Math.PI/2; 
            cr.position.set(0, ceilingY, -6000);
            group.add(cr);

            group.position.set(x, 0, z); group.rotation.y = rot;
            scene.add(group);
        }

        makeBuilding(-12220, 0, Math.PI/2);
        makeBuilding(-6220, 6000, Math.PI);
        makeBuilding(-6220, -6000, 0);

        // --- CONTROLS ---
        camera.position.set(0, 75, 4800); 
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-0.8, Math.min(0.8, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function animate() {
            requestAnimationFrame(animate);
            const speed = keys.ShiftLeft ? 45 : 22;
            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            if (dir.length() > 0) {
                dir.normalize().applyQuaternion(camera.quaternion);
                dir.y = 0;
                const nX = camera.position.x + dir.x * speed;
                const nZ = camera.position.z + dir.z * speed;
                if (nX < 180 && nX > -180) camera.position.x = nX;
                if (nZ < 4950 && nZ > -4950) camera.position.z = nZ;
            }
            if (camera.position.z < -4900) window.location.href = "level!.html";
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
