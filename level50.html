<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 50 - The Morbid Highway</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffe4b5; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #daa520; z-index: 10; font-weight: bold; 
            text-shadow: 2px 2px #000;
        }
        .gui-line { font-size: 1.1rem; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 1px; }
        #death { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; z-index: 100; color: #ff0000; background: #000; font-size: 2rem; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="gui-line">LEVEL 50 - THE MORBID HIGHWAY</div>
        <div class="gui-line">GET TO THE END OF THE HIGHWAY</div>
    </div>
    <div id="death"><h1>CAUGHT</h1></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5e6);
        scene.fog = new THREE.Fog(0xfff5e6, 100, 4000);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 40000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const walls = [];
        const entities = [];
        let isEnding = false;

        const HW_WIDTH = 1200; 
        const MAP_LEN = 30000;

        // --- MATERIALS ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const sandMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const yellowMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

        // --- ENVIRONMENT ---
        const sand = new THREE.Mesh(new THREE.PlaneGeometry(10000, MAP_LEN), sandMat);
        sand.rotation.x = -Math.PI / 2;
        sand.position.z = MAP_LEN / 2;
        scene.add(sand);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(HW_WIDTH, MAP_LEN), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.5;
        road.position.z = MAP_LEN / 2;
        scene.add(road);

        for(let z = 0; z < MAP_LEN; z += 400) {
            const median = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), yellowMat);
            median.rotation.x = -Math.PI / 2;
            median.position.set(0, 1, z);
            scene.add(median);
            const lDiv = new THREE.Mesh(new THREE.PlaneGeometry(6, 100), lineMat);
            lDiv.rotation.x = -Math.PI / 2;
            lDiv.position.set(-300, 1, z);
            scene.add(lDiv);
            const rDiv = lDiv.clone();
            rDiv.position.set(300, 1, z);
            scene.add(rDiv);
        }

        function buildWall(x, z, w, d) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, 4000, d), new THREE.MeshStandardMaterial({color: 0xeeddbb}));
            m.position.set(x, 2000, z);
            scene.add(m);
            walls.push(new THREE.Box3().setFromObject(m));
        }
        buildWall(-5000, MAP_LEN/2, 100, MAP_LEN);
        buildWall(5000, MAP_LEN/2, 100, MAP_LEN);
        buildWall(0, -50, 10000, 100);
        buildWall(0, MAP_LEN + 50, 10000, 100);

        // --- GAS STATION ---
        const stationZ = MAP_LEN - 1500;
        const stationX = 1100; 
        const station = new THREE.Group();
        const bldg = new THREE.Mesh(new THREE.BoxGeometry(450, 200, 350), new THREE.MeshStandardMaterial({color: 0xffffff}));
        bldg.position.y = 100;
        station.add(bldg);
        station.position.set(stationX, 0, stationZ);
        scene.add(station);
        walls.push(new THREE.Box3().setFromObject(bldg).applyMatrix4(station.matrixWorld));

        // --- WATCHERS (SCATTERED) ---
        for(let i = 0; i < 80; i++) {
            const w = new THREE.Mesh(new THREE.BoxGeometry(35, 400, 35), new THREE.MeshBasicMaterial({color: 0x000000}));
            const xPos = (Math.random() > 0.5 ? 1 : -1) * (800 + Math.random() * 3500);
            const zPos = 1500 + (Math.random() * (MAP_LEN - 4000));
            w.position.set(xPos, 200, zPos);
            scene.add(w);
            entities.push(w);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(500, 2000, 1000);
        scene.add(sun);

        camera.position.set(0, 80, 200);
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(45, 100, 45));
            for (let wallBox of walls) {
                if (playerBox.intersectsBox(wallBox)) return true;
            }
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const isSprinting = keys.ShiftLeft;
            const speed = isSprinting ? 35 : 14; // Player is fast, but entities are relentless
            const move = new THREE.Vector3();
            if(keys.KeyW) move.z -= 1; if(keys.KeyS) move.z += 1;
            if(keys.KeyA) move.x -= 1; if(keys.KeyD) move.x += 1;
            
            if(move.length() > 0) {
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                const nextPos = camera.position.clone().addScaledVector(move, speed);
                if (!checkCollision(nextPos)) camera.position.copy(nextPos);
            }

            const offRoad = Math.abs(camera.position.x) > HW_WIDTH / 2;

            entities.forEach(m => {
                const d = camera.position.distanceTo(m.position);
                
                // If you are off-road, they move at 100% speed immediately.
                // If you are on-road, they move at 100% speed ONLY if you look away.
                const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                const toEnt = m.position.clone().sub(camera.position).normalize();
                const lookingAway = camDir.dot(toEnt) < 0.2;

                if (offRoad && d < 6000) {
                    // Full speed chase - no slowing down
                    m.position.add(toEnt.negate().multiplyScalar(22)); 
                } else if (d < 2500 && lookingAway) {
                    // High speed creep - no slowing down
                    m.position.add(toEnt.negate().multiplyScalar(15));
                }

                if (d < 85) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 3000);
                }
            });

            if(camera.position.distanceTo(new THREE.Vector3(stationX, 80, stationZ)) < 300) {
                isEnding = true;
                window.location.href = "level188.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
