<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 47 - The Forest of Decay</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2a2a2a; font-family: 'Courier New', monospace; }
        
        /* Unified GUI - Exactly like the Arabian Desert scaling */
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #daa520; z-index: 10; font-weight: bold; 
            text-shadow: 2px 2px #000;
        }
        .gui-line { 
            font-size: 1.1rem; 
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; opacity: 0; pointer-events: none; z-index: 5;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            z-index: 100; color: #ff0000; background: #000; font-size: 2rem;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="gui-line">LEVEL 47 - THE FOREST OF DECAY</div>
        <div class="gui-line">FIND THE IRON GATE</div>
    </div>

    <div id="overlay"></div>
    <div id="death"><h1>CONSUMED</h1></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); // Brighter background
        scene.fog = new THREE.Fog(0x333333, 500, 6000); // Pushed fog back significantly

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 80000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const obstacles = [];
        const monsters = [];
        let sanity = 100;
        let isEnding = false;

        const WORLD_SIZE = 60000;
        const EXIT_POS = new THREE.Vector3((Math.random()-0.5)*45000, 0, (Math.random()-0.5)*45000);

        // Materials
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
        const entityMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        // World Box (Perimeter Walls)
        const wallThickness = 500;
        const wallHeight = 5000;
        const wallGeom = new THREE.BoxGeometry(WORLD_SIZE, wallHeight, wallThickness);
        
        const walls = [
            { x: 0, z: WORLD_SIZE/2 }, { x: 0, z: -WORLD_SIZE/2 },
            { x: WORLD_SIZE/2, z: 0, rot: Math.PI/2 }, { x: -WORLD_SIZE/2, z: 0, rot: Math.PI/2 }
        ];

        walls.forEach(w => {
            const m = new THREE.Mesh(wallGeom, stoneMat);
            m.position.set(w.x, wallHeight/2, w.z);
            if(w.rot) m.rotation.y = w.rot;
            scene.add(m);
            obstacles.push(new THREE.Box3().setFromObject(m));
        });

        // Ground
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE), new THREE.MeshStandardMaterial({color: 0x444444}));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Stone Forest & Monsters
        for(let i=0; i<600; i++) {
            const rx = (Math.random() - 0.5) * (WORLD_SIZE - 2000);
            const rz = (Math.random() - 0.5) * (WORLD_SIZE - 2000);
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(25, 45, 1000), stoneMat);
            trunk.position.set(rx, 500, rz);
            scene.add(trunk);
            obstacles.push(new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(rx, 500, rz), new THREE.Vector3(70, 1000, 70)));

            if(Math.random() > 0.93) {
                const monster = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(15, 250, 15), entityMat);
                const head = new THREE.Mesh(new THREE.SphereGeometry(18), entityMat);
                head.position.y = 140;
                monster.add(body, head);
                monster.position.set(rx + 120, 125, rz + 120);
                scene.add(monster);
                monsters.push(monster);
            }
        }

        const gate = new THREE.Mesh(new THREE.BoxGeometry(300, 500, 50), new THREE.MeshBasicMaterial({color: 0x111111}));
        gate.position.set(EXIT_POS.x, 250, EXIT_POS.z);
        scene.add(gate);

        // Brighter Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6); // Stronger ambient
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5000, 10000, 5000);
        scene.add(sun);

        camera.position.set(0, 150, 0);
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(60, 100, 60));
            for(let b of obstacles) if(playerBox.intersectsBox(b)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 18.0 : 9.5; 
            const move = new THREE.Vector3();
            if(keys.KeyW) move.z -= 1; if(keys.KeyS) move.z += 1;
            if(keys.KeyA) move.x -= 1; if(keys.KeyD) move.x += 1;
            
            if(move.length() > 0) {
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                const nextX = camera.position.clone(); nextX.x += move.x * speed;
                if(!checkCollision(nextX)) camera.position.x = nextX.x;
                const nextZ = camera.position.clone(); nextZ.z += move.z * speed;
                if(!checkCollision(nextZ)) camera.position.z = nextZ.z;
            }

            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if(dist < 3000) {
                    m.position.lerp(new THREE.Vector3(camera.position.x, 125, camera.position.z), 0.004);
                    if(dist < 600) sanity -= 0.5;
                    if(dist < 250) sanity -= 2.5;
                }
                m.lookAt(camera.position.x, 125, camera.position.z);
                m.position.x += (Math.random() - 0.5) * 2;
            });

            sanity -= 0.002; 
            document.getElementById('overlay').style.opacity = 1 - (sanity / 100);

            if(sanity <= 0) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 3000);
            }

            if(camera.position.distanceTo(gate.position) < 350) {
                isEnding = true;
                window.location.href = "level48.html";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
