<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 48 - The Sunset Savanna</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2a1b2a; font-family: 'Courier New', monospace; }
        
        /* Unified GUI Block - Exact Arabian Desert Scale */
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #daa520; z-index: 10; font-weight: bold; 
            text-shadow: 2px 2px #000;
        }
        .gui-line { 
            font-size: 1.1rem; /* Precise uniform scaling */
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; opacity: 0; pointer-events: none; z-index: 5;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            z-index: 100; color: #ff0000; background: #000; font-size: 2rem;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="gui-line">LEVEL 48 - THE SUNSET SAVANNA</div>
        <div class="gui-line">LOOK FOR THE OUTPOST</div>
    </div>

    <div id="overlay"></div>
    <div id="death"><h1>CAUGHT</h1></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3a1f3a);
        scene.fog = new THREE.Fog(0x3a1f3a, 100, 15000);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const obstacles = [];
        const entities = [];
        let fatigue = 0;
        let isEnding = false;
        let idleFrames = 0; 

        const WORLD_SIZE = 80000;
        const EXIT_POS = new THREE.Vector3((Math.random()-0.5)*50000, 0, (Math.random()-0.5)*50000);

        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 1 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a0f0a });
        const canopyMat = new THREE.MeshStandardMaterial({ color: 0x0f1a0f, transparent: true, opacity: 0.8 });

        function getTerrainHeight(x, z) {
            return (Math.sin(x/4000) * Math.cos(z/4000) * 400) + (Math.sin(x/800) * 120);
        }

        // Floor
        const floorGeo = new THREE.PlaneGeometry(WORLD_SIZE * 1.2, WORLD_SIZE * 1.2, 80, 80);
        const verts = floorGeo.attributes.position.array;
        for(let i = 0; i < verts.length; i += 3) {
            verts[i+2] = getTerrainHeight(verts[i], -verts[i+1]);
        }
        floorGeo.computeVertexNormals();
        const floor = new THREE.Mesh(floorGeo, grassMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Acacia Trees & Deathmoths
        for(let i=0; i<450; i++) {
            const rx = (Math.random() - 0.5) * WORLD_SIZE;
            const rz = (Math.random() - 0.5) * WORLD_SIZE;
            if(Math.sqrt(rx*rx + rz*rz) < 800) continue; 
            const h = getTerrainHeight(rx, rz);
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(35, 45, 500), trunkMat);
            trunk.position.set(rx, h + 250, rz);
            scene.add(trunk);
            
            const canopy = new THREE.Mesh(new THREE.CylinderGeometry(350, 400, 60), canopyMat);
            canopy.position.set(rx, h + 500, rz);
            scene.add(canopy);
            
            obstacles.push(new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(rx, h + 250, rz), 
                new THREE.Vector3(80, 1000, 80)
            ));

            if(Math.random() > 0.9) {
                const moth = new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({color: 0x000000}));
                moth.position.set(rx + 50, h + 300, rz + 50);
                scene.add(moth);
                entities.push(moth);
            }
        }

        // Research Outpost
        const outpost = new THREE.Mesh(new THREE.ConeGeometry(300, 450, 4), new THREE.MeshStandardMaterial({color: 0x111111}));
        EXIT_POS.y = getTerrainHeight(EXIT_POS.x, EXIT_POS.z) + 225;
        outpost.position.copy(EXIT_POS);
        scene.add(outpost);

        scene.add(new THREE.DirectionalLight(0xff7700, 2), new THREE.AmbientLight(0x3a1f3a, 0.5));

        camera.position.set(0, 200, 0);
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(70, 100, 70));
            for(let b of obstacles) if(playerBox.intersectsBox(b)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const isMoving = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD;
            const speed = keys.ShiftLeft ? 15.0 : 8.0;
            
            if (isMoving) {
                idleFrames = 0; 
                const move = new THREE.Vector3();
                if(keys.KeyW) move.z -= 1; if(keys.KeyS) move.z += 1;
                if(keys.KeyA) move.x -= 1; if(keys.KeyD) move.x += 1;
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                
                const nextX = camera.position.clone(); nextX.x += move.x * speed;
                if(!checkCollision(nextX)) camera.position.x = nextX.x;
                const nextZ = camera.position.clone(); nextZ.z += move.z * speed;
                if(!checkCollision(nextZ)) camera.position.z = nextZ.z;

                fatigue = Math.max(0, fatigue - 0.2);
            } else {
                idleFrames++;
                if(idleFrames > 120) { 
                    fatigue += 1.0; 
                }
            }

            // Deathmoths drain fatigue when near
            entities.forEach(m => {
                if(camera.position.distanceTo(m.position) < 500) fatigue += 0.4;
                m.position.y += Math.sin(Date.now() * 0.01) * 0.5;
            });

            camera.position.y = THREE.MathUtils.lerp(camera.position.y, getTerrainHeight(camera.position.x, camera.position.z) + 110, 0.1);
            document.getElementById('overlay').style.opacity = fatigue / 100;

            if(fatigue >= 100) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 3000);
            }

            if(camera.position.distanceTo(EXIT_POS) < 400) {
                isEnding = true;
                window.location.href = "level49.html";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
