<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 25 - The Arcade</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #000; z-index: 10; font-size: 1.5rem; 
            pointer-events: none; font-weight: bold;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #fff; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 25 - THE ARCADE</div>
    <div id="death">CONNECTION TERMINATED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(0xffffff, 1, 350);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isEnding = false;
        const walls = [];
        const cabinetHitboxes = [];

        // MATERIALS
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x1a0033 }); 
        const cabinetMat = new THREE.MeshStandardMaterial({ color: 0x222222 }); 
        const screenMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
        const exitBoxMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // THE WHITE BOX
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });

        // FLOOR & CEILING
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500), carpetMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500), wallMat);
        ceiling.position.y = 50;
        ceiling.rotation.x = Math.PI / 2;
        scene.add(ceiling);

        // BOUNDARY WALLS
        function createBoundary(w, h, d, x, z) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            b.position.set(x, h/2, z);
            scene.add(b);
            walls.push(new THREE.Box3().setFromObject(b));
        }
        createBoundary(1500, 100, 10, 0, 750);  
        createBoundary(1500, 100, 10, 0, -750); 
        createBoundary(10, 100, 1500, 750, 0);  
        createBoundary(10, 100, 1500, -750, 0); 

        // DETAILED ARCADE MACHINE
        function createArcade(x, z, isExit = false) {
            const group = new THREE.Group();
            const w = 5 + Math.random() * 4; // Random width
            const h = 12 + Math.random() * 6; // Random height
            
            // Cabinet
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 7), cabinetMat);
            group.add(body);

            // Screen
            const sW = w * 0.7;
            const sH = h * 0.3;
            const screenGeo = new THREE.PlaneGeometry(sW, sH);
            const screen = new THREE.Mesh(screenGeo, isExit ? exitBoxMat : screenMat);
            screen.position.set(0, h/2 - 4, 3.51);
            group.add(screen);

            // Console/Buttons ledge
            const ledge = new THREE.Mesh(new THREE.BoxGeometry(w, 1, 3), cabinetMat);
            ledge.position.set(0, h/2 - 7, 4);
            group.add(ledge);

            group.position.set(x, h/2, z);
            scene.add(group);
            
            if(!isExit) {
                cabinetHitboxes.push(new THREE.Box3().setFromObject(body));
            }
            return group;
        }

        // GENERATE TIGHT AISLES
        const exitIndex = Math.floor(Math.random() * 150);
        let count = 0;
        let exitMachineRef = null;
        let exitPos = {x: 0, z: 0};

        for(let i = -12; i <= 12; i++) {
            for(let j = -12; j <= 12; j++) {
                if(Math.abs(i) < 2 && Math.abs(j) < 2) continue;
                
                if(Math.random() > 0.6) {
                    const x = i * 40;
                    const z = j * 25; // Closer together in rows
                    const isExit = (count === exitIndex);
                    const m = createArcade(x, z, isExit);
                    if(isExit) {
                        exitMachineRef = m;
                        exitPos = {x, z};
                    }
                    count++;
                }
            }
        }

        // MONSTER (The Glitch)
        const monster = new THREE.Mesh(new THREE.BoxGeometry(4, 22, 4), new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true}));
        monster.position.set(150, 11, 150);
        scene.add(monster);

        // BLINDING WHITE LIGHTING
        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(50, 200, 50);
        scene.add(mainLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        camera.position.set(0, 12, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(4, 4, 4));
            for(let b of walls) if(pBox.intersectsBox(b)) return true;
            for(let b of cabinetHitboxes) if(pBox.intersectsBox(b)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;
            
            if (move.length() > 0) {
                move.applyQuaternion(camera.quaternion);
                move.y = 0; move.normalize().multiplyScalar(keys.ShiftLeft ? 3.2 : 1.8);
                
                const nX = camera.position.clone().add(new THREE.Vector3(move.x, 0, 0));
                if (!checkCollision(nX)) camera.position.x = nX.x;
                const nZ = camera.position.clone().add(new THREE.Vector3(0, 0, move.z));
                if (!checkCollision(nZ)) camera.position.z = nZ.z;
            }

            // INSTANT TP UPON TOUCHING EXIT MACHINE
            const dToExit = new THREE.Vector2(camera.position.x, camera.position.z).distanceTo(new THREE.Vector2(exitPos.x, exitPos.z));
            if (dToExit < 10) {
                isEnding = true;
                window.location.href = "level26.html";
                return;
            }

            // Monster Logic
            const mDist = monster.position.distanceTo(camera.position);
            if (mDist < 450) {
                monster.position.add(new THREE.Vector3().subVectors(camera.position, monster.position).normalize().multiplyScalar(1.6));
                monster.lookAt(camera.position.x, 11, camera.position.z);
            }
            if (mDist < 14) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
