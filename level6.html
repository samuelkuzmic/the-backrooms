<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 6</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffffff; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; font-weight: bold;
            opacity: 0.4;
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: #444; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 1.5rem; letter-spacing: 10px;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 6: LIGHTS OUT<br>VISIBILITY: CRITICAL | FIND THE PURPLE SPARK</div>
    <div id="death-screen">LOST IN THE DARK</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.Fog(0x000000, 1, 15); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const collidables = [];
        let exitSpark = null;
        let isDead = false;

        const wallMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a, shininess: 10 }); 
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
        const insanityMat = new THREE.MeshBasicMaterial({ color: 0x220000, wireframe: true });

        const flashLight = new THREE.PointLight(0xffffff, 2.5, 12); 
        scene.add(flashLight);

        function addWall(w, h, d, x, y, z) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, y, z);
            scene.add(m);
            collidables.push(new THREE.Box3().setFromObject(m));
        }

        const size = 80;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);

        for(let i = 0; i < 30; i++) {
            const wx = (Math.random() - 0.5) * size;
            const wz = (Math.random() - 0.5) * size;
            const isLong = Math.random() > 0.5;
            addWall(isLong ? 12 : 1, 6, isLong ? 1 : 12, wx, 3, wz);
        }

        addWall(size, 8, 1, 0, 4, size/2);
        addWall(size, 8, 1, 0, 4, -size/2);
        addWall(1, 8, size, size/2, 4, 0);
        addWall(1, 8, size, -size/2, 4, 0);

        const sparkGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const sparkMat = new THREE.MeshBasicMaterial({ color: 0xbf00ff });
        exitSpark = new THREE.Mesh(sparkGeo, sparkMat);
        exitSpark.position.set((Math.random()-0.5)*70, 1.5, (Math.random()-0.5)*70);
        scene.add(exitSpark);
        
        const sparkGlow = new THREE.PointLight(0xbf00ff, 15, 10);
        sparkGlow.position.copy(exitSpark.position);
        scene.add(sparkGlow);

        // --- MONSTER: TUNED INSANITY ---
        const insanity = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3, 1.2), insanityMat);
        // Spawned much further away (50 units) to give player a head start
        insanity.position.set(0, 1.5, -50);
        scene.add(insanity);

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => location.reload(), 2500);
        }

        let yaw = 0, pitch = 0;
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        camera.position.set(0, 1.7, 0); 
        const pBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);
            if (isDead) return;

            if (document.pointerLockElement) {
                const speed = keys.ShiftLeft ? 0.25 : 0.12;
                const moveVec = new THREE.Vector3();
                if (keys.KeyW) moveVec.z -= 1;
                if (keys.KeyS) moveVec.z += 1;
                if (keys.KeyA) moveVec.x -= 1;
                if (keys.KeyD) moveVec.x += 1;
                moveVec.applyQuaternion(camera.quaternion);
                moveVec.y = 0;
                moveVec.normalize().multiplyScalar(speed);

                const nextX = camera.position.x + moveVec.x;
                const nextZ = camera.position.z + moveVec.z;

                camera.position.x = nextX;
                pBox.setFromCenterAndSize(camera.position, new THREE.Vector3(1, 1.8, 1));
                for(let box of collidables) if(pBox.intersectsBox(box)) camera.position.x -= moveVec.x;

                camera.position.z = nextZ;
                pBox.setFromCenterAndSize(camera.position, new THREE.Vector3(1, 1.8, 1));
                for(let box of collidables) if(pBox.intersectsBox(box)) camera.position.z -= moveVec.z;

                camera.position.y = 1.7;
                flashLight.position.copy(camera.position);

                // --- STALKER AI LOGIC ---
                const distToInsanity = camera.position.distanceTo(insanity.position);
                const dir = new THREE.Vector3().subVectors(camera.position, insanity.position).normalize();
                
                let currentChaseSpeed = 0.07; // Very slow crawl initially
                
                if (distToInsanity < 12) {
                    // FRENZY: Triggered when you get too close. Impossible to outrun.
                    currentChaseSpeed = 0.38; 
                    insanity.material.color.setHex(0xff0000); 
                    flashLight.intensity = Math.random() > 0.5 ? 0.1 : 3; // Violent flicker
                } else {
                    insanity.material.color.setHex(0x220000);
                    flashLight.intensity = 2.5;
                }

                insanity.position.x += dir.x * currentChaseSpeed;
                insanity.position.z += dir.z * currentChaseSpeed;
                
                if (distToInsanity < 1.8) die();

                if(exitSpark) {
                    exitSpark.scale.setScalar(1 + Math.sin(Date.now() * 0.01) * 0.2);
                }

                if (camera.position.distanceTo(exitSpark.position) < 2) {
                    window.location.href = "level7.html";
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
