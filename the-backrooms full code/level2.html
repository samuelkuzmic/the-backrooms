<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #d44; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; text-shadow: 2px 2px #000;
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: #fff; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 2 - "PIPE DREAMS"<br>GET TO THE WHITE BOX</div>
    <div id="death-screen">CAUGHT</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const WALL_H = 3.5;
        const P_RAD = 0.4; 
        const HALL_WIDTH = 4.5; 
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const flashlight = new THREE.SpotLight(0xffffff, 60, 40, Math.PI/5, 0.4);
        scene.add(flashlight);
        scene.add(flashlight.target);
        scene.add(new THREE.AmbientLight(0x110500, 0.3));

        const darkWall = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.9, roughness: 0.1 });
        const lightFixMat = new THREE.MeshBasicMaterial({ color: 0xffeeaa });

        const wallBoxes = [];
        function addSolidObj(mesh) {
            scene.add(mesh);
            const box = new THREE.Box3().setFromObject(mesh);
            wallBoxes.push(box);
        }

        const tLen = 400;
        const f = new THREE.Mesh(new THREE.PlaneGeometry(HALL_WIDTH, tLen), darkWall);
        f.rotation.x = -Math.PI/2;
        const c = new THREE.Mesh(new THREE.PlaneGeometry(HALL_WIDTH, tLen), darkWall);
        c.rotation.x = Math.PI/2; c.position.y = WALL_H;
        scene.add(f, c);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, WALL_H, tLen), darkWall);
        leftWall.position.set(-HALL_WIDTH/2 - 0.5, WALL_H/2, 0);
        addSolidObj(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, WALL_H, tLen), darkWall);
        rightWall.position.set(HALL_WIDTH/2 + 0.5, WALL_H/2, 0);
        addSolidObj(rightWall);

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(HALL_WIDTH, WALL_H, 1), darkWall);
        backWall.position.set(0, WALL_H/2, 200.5);
        addSolidObj(backWall);

        for(let z = -tLen/2; z < tLen/2; z += 4) {
            for(let i = 0; i < 4; i++) {
                const h = 0.5 + (i * 0.8);
                const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 4.1, 8), pipeMat);
                pL.rotation.x = Math.PI/2;
                pL.position.set(-HALL_WIDTH/2 + 0.2, h, z);
                addSolidObj(pL);
                
                const pR = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 4.1, 8), pipeMat);
                pR.rotation.x = Math.PI/2;
                pR.position.set(HALL_WIDTH/2 - 0.2, h, z);
                addSolidObj(pR);
            }
            if(z % 20 === 0) {
                const fix = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.3), lightFixMat);
                fix.position.set(0, WALL_H - 0.05, z);
                scene.add(fix);
                const glow = new THREE.PointLight(0xffccaa, 10, 15);
                glow.position.set(0, WALL_H - 0.5, z);
                scene.add(glow);
            }
        }

        const exitBlock = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshBasicMaterial({color: 0xffffff}));
        exitBlock.position.set(0, 1, -190);
        scene.add(exitBlock);

        let monster = null;
        let monsterTriggered = false;
        let isDead = false;
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

        let yaw = 0, pitch = 0;
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        camera.position.set(0, 1.7, 185);

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => location.reload(), 1500);
        }

        function update() {
            requestAnimationFrame(update);
            if (isDead) return;

            if (document.pointerLockElement) {
                const speed = keys['ShiftLeft'] ? 0.2 : 0.1;
                const move = new THREE.Vector3();
                if (keys['KeyW']) move.z -= 1;
                if (keys['KeyS']) move.z += 1;
                if (keys['KeyA']) move.x -= 1;
                if (keys['KeyD']) move.x += 1;

                if (move.length() > 0) {
                    move.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const nextPos = camera.position.clone();
                    nextPos.x += move.x * speed;
                    let hitX = false;
                    const pBoxX = new THREE.Box3().setFromCenterAndSize(nextPos, new THREE.Vector3(P_RAD, 1, P_RAD));
                    for(let b of wallBoxes) { if(b.intersectsBox(pBoxX)) hitX = true; }
                    if(!hitX) camera.position.x = nextPos.x;

                    nextPos.x = camera.position.x;
                    nextPos.z += move.z * speed;
                    let hitZ = false;
                    const pBoxZ = new THREE.Box3().setFromCenterAndSize(nextPos, new THREE.Vector3(P_RAD, 1, P_RAD));
                    for(let b of wallBoxes) { if(b.intersectsBox(pBoxZ)) hitZ = true; }
                    if(!hitZ) camera.position.z = nextPos.z;
                }
            }

            // --- THE CHASE ---
            // Trigger when player reaches Z=100 (after a short walk)
            if (!monsterTriggered && camera.position.z < 100) {
                monsterTriggered = true;
                monster = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), monsterMat);
                monster.position.set(0, 1.5, 198); // Spawns way back at the start
                scene.add(monster);
            }

            if (monster) {
                const dist = camera.position.distanceTo(monster.position);
                // SPEED 0.20: He is as fast as your sprint.
                const dir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                monster.position.x += dir.x * 0.20;
                monster.position.z += dir.z * 0.20;
                monster.lookAt(camera.position);
                
                if (dist < 1.1) die();
            }

            flashlight.position.copy(camera.position);
            const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
            flashlight.target.position.copy(targetPos);

            if (camera.position.distanceTo(exitBlock.position) < 1.5) {
                window.location.href = "level3.html";
            }
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
