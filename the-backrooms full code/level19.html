<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 19 - Fixed Movement</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050302; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ff9900; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; 
        }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #ff3300; background: #000;
            text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 19 - THE ATTIC<br>FIND THE LIGHT</div>
    <div id="overlay">CAUGHT IN THE DUST</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050302);
        scene.fog = new THREE.Fog(0x050302, 0.5, 45);

        const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.05, 150);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const woodMat = new THREE.MeshBasicMaterial({ color: 0x110a05 });
        const boxMat = new THREE.MeshBasicMaterial({ color: 0x2d1f14 });
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });

        const walls = [];
        let isEnding = false;

        function createBound(w, h, d, x, z) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            b.position.set(x, h/2, z);
            scene.add(b);
            walls.push(new THREE.Box3().setFromObject(b));
        }
        createBound(200, 10, 5, 0, 100); createBound(200, 10, 5, 0, -100);
        createBound(5, 10, 200, 100, 0); createBound(5, 10, 200, -100, 0);

        function createBox(x, z, h) {
            const box = new THREE.Mesh(new THREE.BoxGeometry(6, h, 6), boxMat);
            box.position.set(x, h/2, z);
            scene.add(box);
            walls.push(new THREE.Box3().setFromObject(box));
        }

        // STATIC MAZE GRID
        for(let i = -10; i <= 10; i++) {
            for(let j = -10; j <= 10; j++) {
                if (Math.abs(i) < 2 && Math.abs(j) < 2) continue; 
                if ((i + j) % 3 === 0) createBox(i * 9, j * 9, 1.4);
            }
        }

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), woodMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), woodMat);
        roof.position.y = 1.8; roof.rotation.x = Math.PI/2; scene.add(roof);

        // RANDOM BULB
        const angle = Math.random() * Math.PI * 2;
        const radius = 70;
        const exitX = Math.cos(angle) * radius;
        const exitZ = Math.sin(angle) * radius;

        const exitGroup = new THREE.Group();
        exitGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xffffee})));
        exitGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 100), new THREE.MeshBasicMaterial({color: 0xffff00, transparent: true, opacity: 0.3})));
        exitGroup.add(new THREE.PointLight(0xffff00, 8, 25));
        exitGroup.position.set(exitX, 1.5, exitZ);
        scene.add(exitGroup);

        const monster = new THREE.Group();
        monster.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true})));
        monster.add(new THREE.PointLight(0xff0000, 2, 8));
        monster.position.set(-exitX * 0.9, 0.6, -exitZ * 0.9); 
        scene.add(monster);

        scene.add(new THREE.AmbientLight(0x221100, 0.3));
        const pLight = new THREE.PointLight(0xffaa00, 2, 8);
        camera.add(pLight);
        scene.add(camera);

        camera.position.set(0, 0.6, 0);
        let yaw = 0;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002;
                camera.rotation.set(0, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0;
                dir.normalize().multiplyScalar(0.08); // SLOW CRAWL SPEED
                
                // Fixed Collision Check
                const nextPos = camera.position.clone();
                nextPos.x += dir.x;
                let hitX = false;
                const bX = new THREE.Box3().setFromCenterAndSize(nextPos, new THREE.Vector3(0.4, 0.4, 0.4));
                for(let w of walls) if(bX.intersectsBox(w)) hitX = true;
                if(!hitX) camera.position.x = nextPos.x;

                const nextPosZ = camera.position.clone();
                nextPosZ.z += dir.z;
                let hitZ = false;
                const bZ = new THREE.Box3().setFromCenterAndSize(nextPosZ, new THREE.Vector3(0.4, 0.4, 0.4));
                for(let w of walls) if(bZ.intersectsBox(w)) hitZ = true;
                if(!hitZ) camera.position.z = nextPosZ.z;
            }

            const d = camera.position.distanceTo(monster.position);
            if (d < 50) {
                const chase = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                monster.position.add(chase.multiplyScalar(0.24)); 
                monster.lookAt(camera.position.x, 0.6, camera.position.z);
            }
            
            if (d < 0.8) {
                isEnding = true;
                document.getElementById('overlay').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            if (camera.position.distanceTo(new THREE.Vector3(exitX, 0.6, exitZ)) < 3.5) {
                isEnding = true;
                window.location.href = "level20.html";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
