<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 7</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000b1a; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #4da6ff; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; font-weight: bold;
            text-shadow: 0 0 5px #000;
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #00050a; display: none; z-index: 1000;
            color: #003366; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 2rem; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 7: THALASSOPHOBIA<br>SWIM TO THE SURFACE | REACH THE GLOWING BOAT</div>
    <div id="death-screen">DRAGGED DOWN</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isDead = false;
        let velocityY = 0;
        const gravity = -0.012;
        const waterResistance = 0.95;

        // Diving Light - increased range for better visibility
        const diveLight = new THREE.PointLight(0x4da6ff, 25, 60);
        scene.add(diveLight);
        scene.add(new THREE.AmbientLight(0x001122, 0.6));

        // --- Materials ---
        const waterMat = new THREE.MeshPhongMaterial({ 
            color: 0x004488, 
            transparent: true, 
            opacity: 0.4, 
            side: THREE.DoubleSide 
        });
        const boatMat = new THREE.MeshLambertMaterial({ color: 0x3d1c10 });
        const beastMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });

        // --- SURFACE ---
        const surface = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), waterMat);
        surface.rotation.x = -Math.PI/2;
        surface.position.y = 0; 
        scene.add(surface);

        // --- BOAT ---
        const boat = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 18), boatMat);
        boat.add(hull);
        
        const boatLamp = new THREE.PointLight(0xffffaa, 60, 150);
        boatLamp.position.set(0, 5, 0);
        boat.add(boatLamp);
        
        boat.position.set(80, 0, -80);
        scene.add(boat);
        const boatBox = new THREE.Box3();

        // --- THE BEAST (Slower) ---
        const beast = new THREE.Mesh(new THREE.SphereGeometry(7, 12, 12), beastMat);
        const beastGlow = new THREE.PointLight(0xff0000, 8, 30);
        beast.add(beastGlow);
        beast.position.set(100, -50, 100); // Spawns further away
        scene.add(beast);

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => location.reload(), 2500);
        }

        let yaw = 0, pitch = 0;
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        // Start Deep
        camera.position.set(0, -60, 20); 

        function animate() {
            requestAnimationFrame(animate);
            if (isDead) return;

            if (document.pointerLockElement) {
                const inWater = camera.position.y <= 1.0;
                const speed = keys.ShiftLeft ? 0.35 : 0.2;
                const moveVec = new THREE.Vector3();
                
                if (keys.KeyW) moveVec.z -= 1;
                if (keys.KeyS) moveVec.z += 1;
                if (keys.KeyA) moveVec.x -= 1;
                if (keys.KeyD) moveVec.x += 1;
                moveVec.applyQuaternion(camera.quaternion);
                
                if (inWater) {
                    velocityY *= waterResistance;
                    if (keys.Space) velocityY += 0.025;
                    if (keys.KeyC) velocityY -= 0.025;
                    velocityY = Math.max(-0.3, Math.min(0.3, velocityY));
                } else {
                    velocityY += gravity;
                }

                camera.position.x += moveVec.x * speed;
                camera.position.z += moveVec.z * speed;
                camera.position.y += velocityY;

                // Boat Collision
                boatBox.setFromObject(hull);
                if (boatBox.containsPoint(camera.position) && camera.position.y > boat.position.y) {
                    camera.position.y = boat.position.y + 3.5;
                    velocityY = 0;
                    if (keys.Space) velocityY = 0.3;
                }

                if (camera.position.y < -90) camera.position.y = -90;
                diveLight.position.copy(camera.position);

                // SLOWER BEAST AI
                const distToBeast = camera.position.distanceTo(beast.position);
                const beastDir = new THREE.Vector3().subVectors(camera.position, beast.position).normalize();
                
                // Reduced from 0.42 to 0.25 for surface chase
                const currentBeastSpeed = (camera.position.y > -30) ? 0.25 : 0.1;
                beast.position.add(beastDir.multiplyScalar(currentBeastSpeed));

                if (distToBeast < 7) die();

                // Win condition
                const distToBoatCenter = new THREE.Vector2(camera.position.x, camera.position.z).distanceTo(new THREE.Vector2(boat.position.x, boat.position.z));
                if (distToBoatCenter < 6 && camera.position.y > 1.5) {
                    window.location.href = "level8.html";
                }
            }

            if (camera.position.y < 0) {
                renderer.setClearColor(0x00050a);
                scene.fog = new THREE.FogExp2(0x00050a, 0.03);
            } else {
                renderer.setClearColor(0x001122);
                scene.fog = new THREE.FogExp2(0x001122, 0.007);
            }

            boat.position.y = Math.sin(Date.now() * 0.001) * 0.4;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
