<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 29 - The Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Times New Roman', serif; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #d4af37; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #fff; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 29: THE GALLERY<br>FIND THE GIANT BLACK WINDOW.</div>
    <div id="death">COLLECTED</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a221b); 
        scene.fog = new THREE.Fog(0x2a221b, 10, 900);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isEnding = false;
        const walls = [];

        // --- MATERIALS ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc }); 
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a0d06, roughness: 0.1 });

        // --- THE BOXED-IN ROOM ---
        const worldSize = 3000;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, worldSize), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, worldSize), wallMat);
        ceiling.position.y = 70;
        ceiling.rotation.x = Math.PI / 2;
        scene.add(ceiling);

        function createWall(x, z, w, d) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, 70, d), wallMat);
            b.position.set(x, 35, z);
            scene.add(b);
            walls.push(new THREE.Box3().setFromObject(b));
            return b;
        }

        // Perimeter
        createWall(0, 1500, 3000, 20);
        createWall(0, -1500, 3000, 20);
        createWall(1500, 0, 20, 3000);
        createWall(-1500, 0, 20, 3000);

        // --- ROWS ---
        const targetRow = Math.floor(Math.random() * 6) - 3;
        const targetSide = Math.random() > 0.5 ? 1 : -1;
        const targetZ = (Math.random() - 0.5) * 1800;
        let exitTrigger = null;

        for(let i = -3; i <= 3; i++) {
            if (i === 0) continue; // Spawn area
            const xPos = i * 400;
            const rowWall = createWall(xPos, 0, 15, 2600);

            for(let j = -1100; j <= 1100; j += 180) {
                const isExit = (i === targetRow && Math.abs(j - targetZ) < 100);
                const artGroup = new THREE.Group();
                
                // EXIT PAINTING IS BIG
                const artGeo = isExit ? new THREE.PlaneGeometry(45, 55) : new THREE.PlaneGeometry(22, 16);
                const artMat = new THREE.MeshBasicMaterial({ color: isExit ? 0xadd8e6 : Math.random() * 0xffffff });
                const art = new THREE.Mesh(artGeo, artMat);
                
                if(isExit) {
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(50, 60, 2), new THREE.MeshStandardMaterial({color: 0xd4af37, metalness: 1}));
                    frame.position.z = -0.1;
                    artGroup.add(frame);
                    exitTrigger = art;
                }

                artGroup.add(art);
                artGroup.position.set(targetSide * 8.5, 0, j);
                artGroup.rotation.y = (targetSide === 1) ? Math.PI / 2 : -Math.PI / 2;
                rowWall.add(artGroup);
            }
        }

        // --- THE CURATOR (SPEED 4.0 - SLOW STALKER) ---
        const curator = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(3, 18), new THREE.MeshBasicMaterial({color: 0x000000}));
        const face = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({color: 0xffffff}));
        face.position.y = 12;
        curator.add(body, face);
        curator.position.set(1000, 12, 1000);
        scene.add(curator);

        // --- LIGHTS ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const torch = new THREE.PointLight(0xfffaf0, 200, 300);
        camera.add(torch);
        scene.add(camera);

        camera.position.set(0, 20, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(15, 15, 15));
            for(let wall of walls) if(pBox.intersectsBox(wall)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0; 
                dir.normalize().multiplyScalar(keys.ShiftLeft ? 10.0 : 4.5);
                
                const tX = camera.position.clone().add(new THREE.Vector3(dir.x, 0, 0));
                if (!checkCollision(tX)) camera.position.x = tX.x;
                const tZ = camera.position.clone().add(new THREE.Vector3(0, 0, dir.z));
                if (!checkCollision(tZ)) camera.position.z = tZ.z;
            }

            if (exitTrigger) {
                const worldPos = new THREE.Vector3();
                exitTrigger.getWorldPosition(worldPos);
                if (camera.position.distanceTo(worldPos) < 50) {
                    isEnding = true;
                    window.location.href = "level30.html";
                }
            }

            // CURATOR SPEED 4.0
            const mDist = curator.position.distanceTo(camera.position);
            if (mDist < 2800) {
                const mMove = new THREE.Vector3().subVectors(camera.position, curator.position).normalize().multiplyScalar(4.0);
                curator.position.add(mMove);
                curator.lookAt(camera.position.x, 12, camera.position.z);
            }
            if (mDist < 25) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
