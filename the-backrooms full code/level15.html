<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 15 - The Observation Deck</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #008888; z-index: 10; pointer-events: none; font-weight: bold; }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #f00; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 15 - THE OBSERVATION DECK<br>GET TO THE END</div>
    <div id="overlay">CAUGHT.</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); // Decorative only
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

        const walls = [];
        const monsters = [];

        function createWall(x, y, z, w, h, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, y, z);
            scene.add(wall);
            walls.push(new THREE.Box3().setFromObject(wall));
        }

        function createNeon(x, y, z, w, h, d) {
            const neon = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), neonMat);
            neon.position.set(x, y, z);
            scene.add(neon);
        }

        // START BOUNDARY
        createWall(0, 15, 25, 60, 30, 2);

        const hallwayLength = 20;
        for (let i = 0; i < hallwayLength; i++) {
            let z = -i * 60;
            createWall(-20, 15, z, 2, 30, 60.1); 
            createWall(20, 15, z, 2, 30, 60.1);

            // NEON DECORATIONS (Embedded in corners)
            createNeon(-19.5, 0.5, z, 0.5, 0.5, 60); 
            createNeon(19.5, 0.5, z, 0.5, 0.5, 60);
            createNeon(-19.5, 29.5, z, 0.5, 0.5, 60);
            createNeon(19.5, 29.5, z, 0.5, 0.5, 60);

            // VENT AMBUSH LOGIC
            if (i > 4 && i < hallwayLength - 2 && Math.random() > 0.7) {
                const m = new THREE.Group();
                m.add(new THREE.Mesh(new THREE.SphereGeometry(2.5, 8, 8), new THREE.MeshBasicMaterial({color: 0x000000})));
                m.add(new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true})));
                m.position.set(0, 28, z); 
                m.userData = { active: false, ventZ: z };
                scene.add(m);
                monsters.push(m);
            }
        }

        // END DOOR
        const door = new THREE.Mesh(new THREE.BoxGeometry(40, 30, 5), doorMat);
        door.position.set(0, 15, -(hallwayLength * 60) + 30);
        scene.add(door);
        const exitBox = new THREE.Box3().setFromObject(door);

        // FLOOR/CEILING
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(150, 1300), floorMat);
        floor.rotation.x = -Math.PI/2; floor.position.z = -550; scene.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(150, 1300), wallMat);
        roof.rotation.x = Math.PI/2; roof.position.set(0, 30, -550); scene.add(roof);

        // BRIGHT LIGHTING
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        camera.position.set(0, 10, 10);
        let yaw = 0, pitch = 0, isEnding = false;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function checkCollision(pos) {
            let pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(2.5, 2.5, 2.5));
            for(let wall of walls) if(pBox.intersectsBox(wall)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const moveDir = new THREE.Vector3();
            if (keys.KeyW) moveDir.z -= 1; if (keys.KeyS) moveDir.z += 1;
            if (keys.KeyA) moveDir.x -= 1; if (keys.KeyD) moveDir.x += 1;
            
            if (moveDir.length() > 0) {
                moveDir.applyQuaternion(camera.quaternion); moveDir.y = 0;
                let speed = keys.ShiftLeft ? 1.6 : 0.85;
                moveDir.normalize().multiplyScalar(speed);
                
                const nextX = camera.position.clone().add(new THREE.Vector3(moveDir.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveDir.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;
            }

            monsters.forEach(m => {
                // Drop only when player is 30 units PAST the monster
                if (!m.userData.active && camera.position.z < (m.userData.ventZ - 30)) {
                    m.userData.active = true;
                }

                if (m.userData.active) {
                    if (m.position.y > 9) m.position.y -= 1.2; // Drop fast
                    const dir = new THREE.Vector3().subVectors(camera.position, m.position).normalize();
                    m.position.add(dir.multiplyScalar(0.95)); // Chase fast
                    
                    if (camera.position.distanceTo(m.position) < 8) {
                        isEnding = true;
                        document.getElementById('overlay').style.display = 'flex';
                        setTimeout(() => location.reload(), 2000);
                    }
                }
            });

            let pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(2, 2, 2));
            if (pBox.intersectsBox(exitBox)) {
                isEnding = true;
                window.location.href = "level16.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
