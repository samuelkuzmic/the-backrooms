<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 37 - The Poolrooms</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001a1a; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #00ffff; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 37: THE POOLROOMS<br>FIND THE PIT</div>
    <div id="death">CONSUMED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xd0f0f0, 200, 4500);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 15000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // --- TILE TEXTURE (Enhanced for Micro-Scale) ---
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
        ctx.strokeStyle = '#bbcccc'; ctx.lineWidth = 4;
        ctx.strokeRect(0,0,128,128);
        
        const tileTex = new THREE.CanvasTexture(canvas);
        tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
        // High repeat count makes the tiles look much smaller
        tileTex.repeat.set(25, 25); 

        const tileMat = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.1 });
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.35, roughness: 0 });

        const walls = [];
        const entities = [];

        function addWall(x, z, w, d, h = 600) {
            const wallGeo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(wallGeo, tileMat);
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
            walls.push(new THREE.Box3().setFromObject(mesh));
        }

        // --- WORLD GEOMETRY ---
        const mapSize = 10000;
        
        // Floor (Micro-Tiles)
        const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize);
        const floor = new THREE.Mesh(floorGeo, tileMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Ceiling (Micro-Tiles)
        const ceiling = floor.clone();
        ceiling.position.y = 600; ceiling.rotation.x = Math.PI / 2;
        scene.add(ceiling);

        const water = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), waterMat);
        water.rotation.x = -Math.PI / 2; water.position.y = 45;
        scene.add(water);

        // Procedural Walls
        for(let i = 0; i < 15; i++) {
            const wx = (Math.random() - 0.5) * (mapSize - 1000);
            const wz = (Math.random() - 0.5) * (mapSize - 1000);
            addWall(wx, wz, 1000, 80); 
            addWall(wz, wx, 80, 1000); 
        }

        // --- RANDOMIZED EXIT ---
        const exitPos = new THREE.Vector3(
            (Math.random() - 0.5) * (mapSize - 2000), 
            2, 
            (Math.random() - 0.5) * (mapSize - 2000)
        );
        const exitHole = new THREE.Mesh(new THREE.CircleGeometry(250, 32), new THREE.MeshBasicMaterial({color: 0x000000}));
        exitHole.rotation.x = -Math.PI / 2;
        exitHole.position.copy(exitPos);
        scene.add(exitHole);

        // --- SKIN-STEALERS (Lore Accurate: Pale/Yellowish) ---
        function spawnSkinStealer() {
            const safeDist = 1500;
            let sx, sz;
            do {
                sx = (Math.random() - 0.5) * mapSize;
                sz = (Math.random() - 0.5) * mapSize;
            } while (Math.sqrt(sx*sx + sz*sz) < safeDist);

            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(25, 110), new THREE.MeshStandardMaterial({color: 0xecd99b}));
            body.position.y = 80;
            group.add(body);
            group.position.set(sx, 0, sz);
            scene.add(group);
            entities.push({ mesh: group, speed: 7 + Math.random() * 5 });
        }
        for(let i = 0; i < 8; i++) spawnSkinStealer();

        // --- ENGINE ---
        camera.position.set(0, 110, 0);
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkPhysics(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(80, 100, 80));
            for(let w of walls) { if(pBox.intersectsBox(w)) return true; }
            if (Math.abs(pos.x) > mapSize/2 - 50 || Math.abs(pos.z) > mapSize/2 - 50) return true;
            return false;
        }

        let isEnding = false;
        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 24.0 : 13.0;
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;

            if (move.length() > 0) {
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                const nX = camera.position.clone().add(new THREE.Vector3(move.x * speed, 0, 0));
                if (!checkPhysics(nX)) camera.position.x = nX.x;
                const nZ = camera.position.clone().add(new THREE.Vector3(0, 0, move.z * speed));
                if (!checkPhysics(nZ)) camera.position.z = nZ.z;
            }
            
            camera.position.y = 110 + Math.sin(Date.now() * 0.001) * 4;

            if (camera.position.distanceTo(exitPos) < 250) {
                isEnding = true;
                window.location.href = "level38.html";
            }

            entities.forEach(ent => {
                const dist = ent.mesh.position.distanceTo(camera.position);
                const dir = new THREE.Vector3().subVectors(camera.position, ent.mesh.position).normalize();
                ent.mesh.position.add(dir.multiplyScalar(ent.speed));
                ent.mesh.lookAt(camera.position.x, 80, camera.position.z);
                
                if (dist < 100) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2500);
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
