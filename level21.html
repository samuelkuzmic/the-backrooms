<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 21</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffaa00; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; 
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #f00; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 21: THE NUMBERED CORRIDORS<br>DOCUMENTS: <span id="count">0</span>/10<br><span style="font-size: 0.8rem; color: #0f0;">MONSTER STATUS: IDLE</span></div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd2b48c);
        scene.fog = new THREE.Fog(0xd2b48c, 1, 400);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const walls = [];
        let items = [];
        let collected = 0;
        let isEnding = false;

        const wallMat = new THREE.MeshBasicMaterial({ color: 0xdbdbb5 });
        const doorMat = new THREE.MeshBasicMaterial({ color: 0x4a2c1d });

        // --- ENCLOSED BOX BOUNDARIES ---
        const limit = 600;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(limit*2, limit*2), new THREE.MeshBasicMaterial({ color: 0x555555 }));
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(limit*2, limit*2), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
        roof.position.y = 25; roof.rotation.x = Math.PI/2; scene.add(roof);

        function addWall(w, h, d, x, z, isDoor = false) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), isDoor ? doorMat : wallMat);
            m.position.set(x, h/2, z);
            scene.add(m);
            const box = new THREE.Box3().setFromObject(m);
            walls.push(box);
            return box;
        }

        // Outer Perimeter Walls (The Box)
        addWall(limit*2, 50, 10, 0, limit);  // North
        addWall(limit*2, 50, 10, 0, -limit); // South
        addWall(10, 50, limit*2, limit, 0);  // East
        addWall(10, 50, limit*2, -limit, 0); // West

        // Inner Hallway Rows
        for(let i = -8; i <= 8; i++) {
            for(let j = -8; j <= 8; j++) {
                if (Math.abs(i) < 2 && Math.abs(j) < 2) continue;
                const x = i * 70; const z = j * 70;
                if (i % 2 === 0) {
                    addWall(12, 25, 55, x, z); // Solid wall sections
                    // Numbered Doors
                    if(Math.random() > 0.4) addWall(13, 19, 10, x, z + (Math.random()*20-10), true);
                }
            }
        }

        // --- VISIBLE DOCUMENTS ---
        const folderGeo = new THREE.BoxGeometry(2.5, 3.5, 0.3);
        for(let i=0; i<10; i++) {
            const f = new THREE.Mesh(folderGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
            const glow = new THREE.PointLight(0x00ffff, 10, 30);
            f.add(glow);
            // Spawn folders strictly in hallways
            f.position.set((Math.random()-0.5)*(limit-100), 5, (Math.random()-0.5)*(limit-100));
            scene.add(f);
            items.push(f);
        }

        // --- STEALTH MONSTER ---
        const monster = new THREE.Mesh(new THREE.CapsuleGeometry(3, 18), new THREE.MeshBasicMaterial({color: 0x000000}));
        monster.position.set(250, 10, 250);
        monster.userData = { chasing: false };
        scene.add(monster);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        camera.position.set(0, 12, 0);
        const keys = {};
        const raycaster = new THREE.Raycaster();

        window.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(7, 7, 7));
            for(let i=0; i<walls.length; i++) { if(pBox.intersectsBox(walls[i])) return true; }
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            // Sliding Movement
            const speed = keys.ShiftLeft ? 3.0 : 1.6;
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;

            if (move.length() > 0) {
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                const nextX = camera.position.clone(); nextX.x += move.x * speed;
                if (!checkCollision(nextX)) camera.position.x = nextX.x;
                const nextZ = camera.position.clone(); nextZ.z += move.z * speed;
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;
            }

            // Folder Collection
            for(let i = items.length - 1; i >= 0; i--) {
                items[i].rotation.y += 0.02;
                if(camera.position.distanceTo(items[i].position) < 18) {
                    scene.remove(items[i]);
                    items.splice(i, 1);
                    collected++;
                    document.getElementById('count').innerText = collected;
                    if(collected >= 10) { isEnding = true; window.location.href = "level22.html"; return; }
                }
            }

            // --- MONSTER LINE OF SIGHT ---
            const dist = monster.position.distanceTo(camera.position);
            const dirToPlayer = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
            
            raycaster.set(monster.position, dirToPlayer);
            const intersections = raycaster.intersectObjects(scene.children, true);
            
            // If the first thing the monster "sees" is the player (camera), start chase
            let seesPlayer = false;
            if (intersections.length > 0) {
                const firstHitDist = intersections[0].distance;
                if (firstHitDist >= dist - 5) seesPlayer = true;
            }

            if (seesPlayer && dist < 300) {
                monster.userData.chasing = true;
                monster.position.add(dirToPlayer.multiplyScalar(1.3));
                document.querySelector('#ui span:last-child').innerText = "MONSTER STATUS: CHASING";
                document.querySelector('#ui span:last-child').style.color = "#f00";
            } else {
                monster.userData.chasing = false;
                document.querySelector('#ui span:last-child').innerText = "";
                document.querySelector('#ui span:last-child').style.color = "#0f0";
            }

            if (dist < 12) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
