<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 4</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffffff; 
            font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: #fff; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold; text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 4 - THE OFFICE<br>FIND THE MONOLITH | DON'T MAKE NOISE</div>
    <div id="death-screen">EXTRACTED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd9ccae); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const collidables = [];
        let exitBox = null;
        let isDead = false;

        const beigeMat = new THREE.MeshLambertMaterial({ color: 0xeadbb6 }); 
        const carpetMat = new THREE.MeshLambertMaterial({ color: 0x5a6369 }); 
        const deskMat = new THREE.MeshLambertMaterial({ color: 0x3d3021 });   
        const blueWinMat = new THREE.MeshBasicMaterial({ color: 0x00ccff }); 
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });

        scene.add(new THREE.AmbientLight(0xfff5e6, 0.8));
        const headLight = new THREE.PointLight(0xffffff, 15, 30);
        scene.add(headLight);

        const sz = 40; 
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(sz * 3, sz * 3), carpetMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(sz * 3, sz * 3), beigeMat);
        ceil.position.y = 6; ceil.rotation.x = Math.PI/2; scene.add(ceil);

        function createWallWithWindows(x, z, w, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, d), beigeMat);
            wall.position.set(x, 4, z);
            scene.add(wall);
            collidables.push(new THREE.Box3().setFromObject(wall));

            const length = w > d ? w : d;
            for(let i = -length/2 + 5; i < length/2; i += 10) {
                const win = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.5), blueWinMat);
                if(w > d) {
                    win.position.set(x + i, 3.5, z + (z > 0 ? -0.52 : 0.52));
                } else {
                    win.position.set(x + (x > 0 ? -0.52 : 0.52), 3.5, z + i);
                    win.rotation.y = Math.PI/2;
                }
                scene.add(win);
            }
        }

        createWallWithWindows(0, -sz, sz * 2, 1); 
        createWallWithWindows(0, sz, sz * 2, 1);  
        createWallWithWindows(-sz, 0, 1, sz * 2); 
        createWallWithWindows(sz, 0, 1, sz * 2);  

        function createRow(zPos, length, isExitRow, exitCol) {
            const startX = -(length * 6) / 2;
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(length * 6, 2.5, 0.8), beigeMat);
            backWall.position.set(0, 1.25, zPos - 2);
            scene.add(backWall);
            collidables.push(new THREE.Box3().setFromObject(backWall));

            for(let i = 0; i < length; i++) {
                const x = startX + (i * 6) + 3;
                const sideWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 4), beigeMat);
                sideWall.position.set(x - 3, 1.25, zPos);
                scene.add(sideWall);
                collidables.push(new THREE.Box3().setFromObject(sideWall));

                if(i === length - 1) {
                    const endWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 4), beigeMat);
                    endWall.position.set(x + 3, 1.25, zPos);
                    scene.add(endWall);
                    collidables.push(new THREE.Box3().setFromObject(endWall));
                }

                const desk = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.1, 1.5), deskMat);
                desk.position.set(x, 1.1, zPos - 1);
                scene.add(desk);
                collidables.push(new THREE.Box3().setFromObject(desk));

                if(isExitRow && i === exitCol) {
                    exitBox = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), new THREE.MeshBasicMaterial({color: 0xffffff}));
                    exitBox.position.set(x, 2.5, zPos - 1);
                    scene.add(exitBox);
                }
            }
        }

        const exitR = Math.floor(Math.random() * 3);
        const exitC = Math.floor(Math.random() * 8);
        for(let r = 0; r < 3; r++) {
            createRow((r * 20) - 20, 10, r === exitR, exitC);
        }

        // --- MONSTER: BACTERIA ---
        const monster = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 6), monsterMat);
        monster.position.set(0, 2.5, -35); // Spawns at the far end
        scene.add(monster);

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => location.reload(), 1500);
        }

        let yaw = 0, pitch = 0;
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        camera.position.set(0, 1.7, 30);
        const pBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);
            if (isDead) return;

            if (document.pointerLockElement) {
                const speed = keys.ShiftLeft ? 0.35 : 0.16;
                const lastPos = camera.position.clone();

                if (keys.KeyW) camera.translateZ(-speed);
                if (keys.KeyS) camera.translateZ(speed);
                if (keys.KeyA) camera.translateX(-speed);
                if (keys.KeyD) camera.translateX(speed);
                camera.position.y = 1.7;
                headLight.position.copy(camera.position);

                pBox.setFromCenterAndSize(camera.position, new THREE.Vector3(1.6, 1.7, 1.6));
                for (let box of collidables) {
                    if (pBox.intersectsBox(box)) {
                        camera.position.copy(lastPos);
                        break;
                    }
                }

                // --- BACTERIA AI ---
                const distToMonster = camera.position.distanceTo(monster.position);
                if (distToMonster < 50) {
                    // Logic: The faster you move (sprint), the easier it finds you
                    const chaseSpeed = keys.ShiftLeft ? 0.28 : 0.14; 
                    const dir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                    monster.position.x += dir.x * chaseSpeed;
                    monster.position.z += dir.z * chaseSpeed;
                    
                    // Visual "vibration" effect when close
                    if(distToMonster < 15) {
                        monster.position.x += (Math.random() - 0.5) * 0.2;
                        monster.material.color.setHex(0xffffff); // Glows white when close
                    } else {
                        monster.material.color.setHex(0x000000);
                    }
                }
                if (distToMonster < 2) die();

                if (exitBox && camera.position.distanceTo(exitBox.position) < 3) {
                    window.location.href = "level5.html";
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
