<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 38 - Air Pollution</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2b1d00; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffaa00; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 38: AIR POLLUTION<br>FIND THE LARGE TOWER</div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xc27a00, 0.0022);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 15000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xff9900, 2.0);
        scene.add(ambient);

        const walls = [];
        const entities = [];
        const mapSize = 40000; 

        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const houseMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const towerMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x221100 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), groundMat);
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        function spawnHouse(x, z) {
            const group = new THREE.Group();
            const h = 550;
            const w = 700; // Houses made wider
            const d = 700; // Houses made wider
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), houseMat);
            body.position.y = h/2;
            group.add(body);

            const roof = new THREE.Mesh(new THREE.ConeGeometry(550, 300, 4), roofMat);
            roof.position.y = h + 150;
            roof.rotation.y = Math.PI / 4;
            group.add(roof);

            group.position.set(x, 0, z);
            scene.add(group);

            // SIMPLIFIED COLLISION BOX: Using manual box to avoid geometry errors
            const collisionBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(x, h/2, z),
                new THREE.Vector3(w, h, d)
            );
            walls.push(collisionBox);
        }

        // GENERATE RESIDENTIAL GRID
        for (let x = -15000; x < 15000; x += 1800) {
            for (let z = -15000; z < 15000; z += 1800) {
                if (Math.abs(x) < 1500 && Math.abs(z) < 1500) continue; 
                if (Math.random() > 0.45) spawnHouse(x, z);
            }
        }

        // --- THE ONLY BIG BUILDING (EXIT TOWER) ---
        const exitPos = new THREE.Vector3(0, 0, -18000);
        const towerSize = 1800;
        const towerGeo = new THREE.BoxGeometry(towerSize, 15000, towerSize);
        const exitTower = new THREE.Mesh(towerGeo, towerMat);
        exitTower.position.set(exitPos.x, 7500, exitPos.z);
        scene.add(exitTower);
        
        const exitBox = new THREE.Box3().setFromCenterAndSize(
            new THREE.Vector3(exitPos.x, 7500, exitPos.z),
            new THREE.Vector3(towerSize, 15000, towerSize)
        );
        walls.push(exitBox);

        const exitLight = new THREE.PointLight(0xff0000, 200, 5000);
        exitLight.position.set(exitPos.x, 300, exitPos.z);
        scene.add(exitLight);

        function spawnSmiler() {
            const smilerGrp = new THREE.Group();
            const glowMat = new THREE.MeshBasicMaterial({color: 0xffffff});
            const lEye = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), glowMat); lEye.position.set(-45, 0, 0);
            const rEye = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), glowMat); rEye.position.set(45, 0, 0);
            const grin = new THREE.Mesh(new THREE.PlaneGeometry(150, 50), glowMat); grin.position.set(0, -60, 0);
            smilerGrp.add(lEye, rEye, grin);
            let sx, sz;
            do { 
                sx = (Math.random()-0.5) * 28000; 
                sz = (Math.random()-0.5) * 28000;
            } while (Math.sqrt(sx*sx + sz*sz) < 6000);
            smilerGrp.position.set(sx, 200, sz);
            scene.add(smilerGrp);
            entities.push({ mesh: smilerGrp, speed: 24 });
        }
        for(let i=0; i<45; i++) spawnSmiler();

        // PLAYER CONTROLS
        camera.position.set(0, 250, 0); // CAMERA EVEN TALLER
        const keys = {};
        const raycaster = new THREE.Raycaster();
        
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            // Player hitbox - tightly centered on camera
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(60, 250, 60));
            for(let w of walls) { if(pBox.intersectsBox(w)) return true; }
            return false;
        }

        let isEnding = false;
        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 50.0 : 25.0;
            const input = new THREE.Vector3();
            if (keys.KeyW) input.z -= 1; if (keys.KeyS) input.z += 1;
            if (keys.KeyA) input.x -= 1; if (keys.KeyD) input.x += 1;

            if (input.length() > 0) {
                input.normalize().applyQuaternion(camera.quaternion);
                input.y = 0;
                
                const nextPos = camera.position.clone();
                nextPos.x += input.x * speed;
                if (!checkCollision(nextPos)) camera.position.x = nextPos.x;
                else nextPos.x = camera.position.x;

                nextPos.z += input.z * speed;
                if (!checkCollision(nextPos)) camera.position.z = nextPos.z;
            }

            // TELEPORT TRIGGER: Get close to the single tower
            if (camera.position.distanceTo(new THREE.Vector3(exitPos.x, camera.position.y, exitPos.z)) < 1200) {
                isEnding = true;
                window.location.href = "level39.html";
            }

            entities.forEach(s => {
                const dist = s.mesh.position.distanceTo(camera.position);
                const dir = new THREE.Vector3().subVectors(camera.position, s.mesh.position).normalize();
                raycaster.set(s.mesh.position, dir);
                const hits = raycaster.intersectObjects(scene.children, true);
                let visible = (hits.length > 0 && hits[0].distance >= dist - 100);

                if (visible && dist < 9000) {
                    s.mesh.position.add(dir.multiplyScalar(s.speed));
                    s.mesh.lookAt(camera.position.x, 200, camera.position.z);
                }
                
                if (dist < 200) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2500);
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
