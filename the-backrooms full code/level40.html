<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 40</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffaa00; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 40: THE VIDEO STORE<br>FIND THE REWIND STATION</div>
    <div id="death">UNREADABLE</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);
        scene.fog = new THREE.Fog(0xeeeeee, 10, 3000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        
        const obstacles = [];
        const mapSize = 5000;

        // --- THE PERIMETER WALLS ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const createOuterWall = (w, h, d, x, z) => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, h/2, z);
            scene.add(wall);
            obstacles.push(new THREE.Box3().setFromObject(wall));
        };

        createOuterWall(mapSize + 100, 500, 50, 0, mapSize/2);  // North
        createOuterWall(mapSize + 100, 500, 50, 0, -mapSize/2); // South
        createOuterWall(50, 500, mapSize + 100, mapSize/2, 0);  // East
        createOuterWall(50, 500, mapSize + 100, -mapSize/2, 0); // West

        // Floor and Roof
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), new THREE.MeshStandardMaterial({ color: 0xdcdcc8 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const roof = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        roof.position.y = 400; roof.rotation.x = Math.PI / 2;
        scene.add(roof);

        // Shelves
        function createShelf(x, z, rot) {
            const shelfGeo = new THREE.BoxGeometry(150, 350, 500);
            const shelf = new THREE.Mesh(shelfGeo, wallMat);
            shelf.position.set(x, 175, z);
            shelf.rotation.y = rot;
            scene.add(shelf);
            obstacles.push(new THREE.Box3().setFromObject(shelf));

            // VHS Tapes
            const tapeMat = new THREE.MeshStandardMaterial({color: 0x222222});
            for(let i = -1; i <= 1; i++) {
                const tapes = new THREE.Mesh(new THREE.BoxGeometry(155, 65, 480), tapeMat);
                tapes.position.set(x, 175 + (i * 95), z);
                tapes.rotation.y = rot;
                scene.add(tapes);
            }
        }

        for(let x = -2000; x <= 2000; x += 1000) {
            for(let z = -2000; z <= 2000; z += 1000) {
                if(Math.abs(x) < 600 && Math.abs(z) < 600) continue;
                createShelf(x, z, Math.random() > 0.5 ? 0 : Math.PI/2);
            }
        }

        // Exit
        const exitPos = new THREE.Vector3(2300, 50, 2300);
        const exitBox = new THREE.Mesh(new THREE.BoxGeometry(150, 20, 150), new THREE.MeshBasicMaterial({color: 0xffffff}));
        exitBox.position.copy(exitPos);
        scene.add(exitBox);
        const exitLight = new THREE.PointLight(0xffffff, 30, 800);
        exitLight.position.set(2300, 150, 2300);
        scene.add(exitLight);

        // Monster
        const monster = new THREE.Mesh(new THREE.CylinderGeometry(35, 35, 250), new THREE.MeshBasicMaterial({color: 0x000000}));
        monster.position.set(-2300, 125, -2300);
        scene.add(monster);

        // Controls Logic
        const keys = {};
        camera.position.set(0, 150, 0);

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function isColliding(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(90, 100, 90));
            for(let box of obstacles) { if(pBox.intersectsBox(box)) return true; }
            return false;
        }

        let dead = false;
        function animate() {
            if(dead) return;
            requestAnimationFrame(animate);

            if (document.pointerLockElement) {
                const speed = keys['ShiftLeft'] ? 35 : 18;
                const move = new THREE.Vector3();
                if (keys['KeyW']) move.z -= 1;
                if (keys['KeyS']) move.z += 1;
                if (keys['KeyA']) move.x -= 1;
                if (keys['KeyD']) move.x += 1;

                if (move.length() > 0) {
                    move.normalize().applyQuaternion(camera.quaternion);
                    move.y = 0;
                    
                    // --- THE SLIDING COMPONENT ---
                    // Try moving X
                    const nextX = camera.position.clone();
                    nextX.x += move.x * speed;
                    if(!isColliding(nextX)) camera.position.x = nextX.x;
                    
                    // Try moving Z
                    const nextZ = camera.position.clone();
                    nextZ.z += move.z * speed;
                    if(!isColliding(nextZ)) camera.position.z = nextZ.z;
                }
            }

            // Monster
            const mDir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
            monster.position.add(mDir.multiplyScalar(13.5));
            
            if(camera.position.distanceTo(monster.position) < 130) {
                dead = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            if(camera.position.distanceTo(exitPos) < 180) {
                dead = true;
                window.location.href = "level41.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
