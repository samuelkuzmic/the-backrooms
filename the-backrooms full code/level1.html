<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 1</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #333; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; text-shadow: 1px 1px #fff;
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: red; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 1 - CONCRETE MAINTENANCE<br>TOUCH BLOCK TO EXIT</div>
    <div id="death-screen">CAUGHT</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const WALL_H = 4.0;
        const P_RAD = 0.5; 
        const scene = new THREE.Scene();
        // Changed fog to a bright white/grey to make the environment feel "blown out"
        scene.fog = new THREE.FogExp2(0xcccccc, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Updated materials to be lighter/brighter
        const concreteMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee }); 
        const floorMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
        const exitMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Green exit for contrast
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });

        const playerLight = new THREE.PointLight(0xffffff, 5, 15);
        scene.add(playerLight);

        // INCREASED AMBIENT LIGHT: This makes the whole place bright white
        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);

        const wallBoxes = [];
        const flickeringLights = [];
        const monsters = [];
        let exitBlock = null;
        let isDead = false;

        function addWall(x, z, w, d, mat = concreteMat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), mat);
            mesh.position.set(x, WALL_H / 2, z);
            scene.add(mesh);
            wallBoxes.push(new THREE.Box3().setFromObject(mesh));
        }

        const mapSize = 100;
        const f = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), floorMat);
        f.rotation.x = -Math.PI/2;
        const c = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), concreteMat);
        c.rotation.x = Math.PI/2; c.position.y = WALL_H;
        scene.add(f, c);

        addWall(0, -mapSize/2, mapSize, 1); 
        addWall(0, mapSize/2, mapSize, 1);  
        addWall(-mapSize/2, 0, 1, mapSize); 
        addWall(mapSize/2, 0, 1, mapSize);  

        for(let x = -20; x <= 20; x += 20) {
            for(let z = -20; z <= 20; z += 20) {
                addWall(x, z, 3, 3);
                // BRIGHT WHITE FLICKERING LIGHTS
                const pL = new THREE.PointLight(0xffffff, 20, 25);
                pL.position.set(x, WALL_H - 0.5, z);
                scene.add(pL);
                flickeringLights.push(pL);
            }
        }

        function createRoom(x, z) {
            const size = 12;
            addWall(x - size/2, z, 1, size); 
            addWall(x + size/2, z, 1, size);
            addWall(x, z + size/2, size, 1);
            addWall(x - 4, z - size/2, 4, 1);
            addWall(x + 4, z - size/2, 4, 1);
            const header = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1), concreteMat);
            header.position.set(x, 3.25, z - size/2);
            scene.add(header);
            wallBoxes.push(new THREE.Box3().setFromObject(header));
            const rL = new THREE.PointLight(0xffffff, 15, 20);
            rL.position.set(x, WALL_H - 1, z);
            scene.add(rL);
            flickeringLights.push(rL); // Added these to flickering list too
        }

        createRoom(-35, 0); 
        createRoom(35, 0);  

        exitBlock = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), exitMat);
        const exitX = Math.random() > 0.5 ? 35 : -35;
        exitBlock.position.set(exitX, 1, 0);
        scene.add(exitBlock);

        camera.position.set(0, 1.7, 40); 
        
        let spawnedCount = 0;
        const potentialSpawns = [
            {x: -40, z: -40}, {x: 40, z: -40}, 
            {x: 0, z: 0}, {x: -35, z: 20}, {x: 35, z: 20}
        ];

        potentialSpawns.forEach(pos => {
            const distFromStart = new THREE.Vector2(pos.x, pos.z).distanceTo(new THREE.Vector2(0, 40));
            if (spawnedCount < 2 && distFromStart > 30) {
                const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 2.2, 4, 8), monsterMat);
                m.position.set(pos.x, 1.2, pos.z);
                scene.add(m);
                monsters.push(m);
                spawnedCount++;
            }
        });

        let yaw = 0, pitch = 0;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => location.reload(), 1500);
        }

        function update() {
            requestAnimationFrame(update);
            if (isDead) return;
            
            if (document.pointerLockElement) {
                const speed = keys['ShiftLeft'] ? 0.22 : 0.12;
                const inputDir = new THREE.Vector3();
                if (keys['KeyW']) inputDir.z -= 1;
                if (keys['KeyS']) inputDir.z += 1;
                if (keys['KeyA']) inputDir.x -= 1;
                if (keys['KeyD']) inputDir.x += 1;

                if (inputDir.length() > 0) {
                    inputDir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const nextX = camera.position.clone();
                    nextX.x += inputDir.x * speed;
                    if(!wallBoxes.some(b => b.intersectsBox(new THREE.Box3().setFromCenterAndSize(nextX, new THREE.Vector3(P_RAD, 1, P_RAD))))) {
                        camera.position.x = nextX.x;
                    }
                    const nextZ = camera.position.clone();
                    nextZ.z += inputDir.z * speed;
                    if(!wallBoxes.some(b => b.intersectsBox(new THREE.Box3().setFromCenterAndSize(nextZ, new THREE.Vector3(P_RAD, 1, P_RAD))))) {
                        camera.position.z = nextZ.z;
                    }
                }
            }

            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if (dist < 45) { 
                    const dir = new THREE.Vector3().subVectors(camera.position, m.position).normalize();
                    m.position.x += dir.x * 0.18;
                    m.position.z += dir.z * 0.18;
                }
                if (dist < 1.2) die(); 
            });

            flickeringLights.forEach(l => {
                // Modified flickering logic for "unstable fluorescent" look
                if (Math.random() > 0.97) {
                    l.intensity = Math.random() > 0.8 ? 2 : 25;
                }
            });

            if (camera.position.distanceTo(exitBlock.position) < 1.5) {
                window.location.href = "level2.html";
            }

            playerLight.position.copy(camera.position);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
