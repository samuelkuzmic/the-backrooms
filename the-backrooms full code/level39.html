<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 39 - Enchanted Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050100; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffaa00; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 39: THE SHIFTING GROVE<br>STAY ON THE PATH</div>
    <div id="death">STRAYED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x110500, 100, 3500);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 6000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xff4400, 0.2));
        const sun = new THREE.PointLight(0xffaa00, 2, 8000);
        sun.position.set(0, 500, -2000);
        scene.add(sun);

        // --- WORLD SETTINGS ---
        const totalLength = 250000;
        const roadWidth = 600;

        // Ground
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(30000, totalLength + 10000), new THREE.MeshStandardMaterial({ color: 0x0a0500 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -totalLength / 2;
        scene.add(ground);

        // Path
        const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, totalLength + 10000), new THREE.MeshStandardMaterial({ color: 0x3d2b1f }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 1;
        road.position.z = -totalLength / 2;
        scene.add(road);

        // --- TREE INSTANCING ---
        const treeCount = 5000;
        const trunkGeo = new THREE.CylinderGeometry(15, 25, 700, 6);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const treeMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
        
        const dummy = new THREE.Object3D();
        for (let i = 0; i < treeCount; i++) {
            let x, z;
            do {
                x = (Math.random() - 0.5) * 15000;
                z = -Math.random() * totalLength;
            } while (Math.abs(x) < roadWidth/2 + 150);

            dummy.position.set(x, 350, z);
            dummy.updateMatrix();
            treeMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(treeMesh);

        // --- WATCHERS ---
        const entities = [];
        for(let z = -3000; z > -totalLength; z -= 2500) {
            [-1, 1].forEach(side => {
                const x = side * (roadWidth/2 + 600);
                const g = new THREE.Group();
                const b = new THREE.Mesh(new THREE.BoxGeometry(20, 350, 20), new THREE.MeshBasicMaterial({color:0x000000}));
                const e = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({color:0xff00ff}));
                e.position.set(0, 160, 12);
                g.add(b, e); g.position.set(x, 175, z);
                scene.add(g);
                entities.push({ mesh: g, eye: e });
            });
        }

        // --- PLAYER SETUP ---
        camera.position.set(0, 120, 0);
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        let isEnding = false;
        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 100 : 50;
            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; 
            if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1;
            if (keys.KeyD) dir.x += 1;

            if (dir.length() > 0) {
                dir.normalize().applyQuaternion(camera.quaternion);
                dir.y = 0;
                camera.position.add(dir.multiplyScalar(speed));
            }

            const onRoad = Math.abs(camera.position.x) < (roadWidth / 2);

            entities.forEach(ent => {
                ent.mesh.lookAt(camera.position.x, 175, camera.position.z);
                if (!onRoad) {
                    ent.eye.material.color.set(0xff0000);
                    ent.mesh.position.add(new THREE.Vector3().subVectors(camera.position, ent.mesh.position).normalize().multiplyScalar(85));
                } else {
                    ent.eye.material.color.set(0xff00ff);
                }

                if (ent.mesh.position.distanceTo(camera.position) < 140) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            if (camera.position.z < -totalLength) {
                isEnding = true;
                window.location.href = "level40.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
