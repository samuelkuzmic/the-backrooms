<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 20 - Optimized & Sliding</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #222; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 1px 1px #fff; 
        }
        #death-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #ff3300; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 20 - THE WAREHOUSE<br>KEYS: <span id="count">0</span>/10</div>
    <div id="death-screen">STOCK REJECTED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(0xffffff, 100, 750);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        document.body.appendChild(renderer.domElement);

        const walls = [];
        let keys = [];
        let keysCollected = 0;
        let isEnding = false;
        let frameCount = 0;

        // Shared Geometries for memory efficiency
        const rackMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x7a5230 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

        // BOUNDARIES
        function createBound(w, h, d, x, z) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, h/2, z);
            scene.add(m);
            walls.push(new THREE.Box3().setFromObject(m));
        }
        createBound(1000, 100, 20, 0, 500); createBound(1000, 100, 20, 0, -500);
        createBound(20, 100, 1000, 500, 0); createBound(20, 100, 1000, -500, 0);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), floorMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const roof = floor.clone(); roof.position.y = 100; roof.rotation.x = Math.PI/2; scene.add(roof);

        // SHELVES
        const pGeo = new THREE.BoxGeometry(1.5, 40, 1.5);
        const bGeo = new THREE.BoxGeometry(7, 9, 9);
        const plGeo = new THREE.BoxGeometry(10, 1, 65);

        function createShelf(x, z) {
            const group = new THREE.Group();
            for(let i=0; i<4; i++) {
                const p = new THREE.Mesh(pGeo, rackMat);
                p.position.set(0, 20, (i*20)-30); group.add(p);
            }
            for(let h=0; h<3; h++) {
                const plank = new THREE.Mesh(plGeo, rackMat);
                plank.position.set(0, (h*13)+5, 0); group.add(plank);
                for(let b=0; b<5; b++) {
                    if(Math.random() > 0.15) {
                        const box = new THREE.Mesh(bGeo, boxMat);
                        box.position.set(0, (h*13)+10, (b*12)-24); group.add(box);
                    }
                }
            }
            group.position.set(x, 0, z);
            scene.add(group);
            walls.push(new THREE.Box3().setFromObject(group));
        }

        for(let r=-7; r<=7; r++) {
            for(let c=-3; c<=3; c++) {
                if(Math.abs(r)<2 && Math.abs(c)<1) continue;
                createShelf(r*60, c*120);
            }
        }

        // KEYS
        const kGeo = new THREE.TorusGeometry(1.2, 0.4);
        const kMat = new THREE.MeshBasicMaterial({color: 0x00ccff});
        for(let i=0; i<10; i++) {
            const k = new THREE.Mesh(kGeo, kMat);
            const light = new THREE.PointLight(0x00ccff, 15, 25);
            k.add(light);
            k.position.set((Math.random()-0.5)*900, 2, (Math.random()-0.5)*900);
            scene.add(k);
            keys.push(k);
        }

        // MONSTER
        const monster = new THREE.Group();
        monster.add(new THREE.Mesh(new THREE.BoxGeometry(12, 45, 12), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true})));
        monster.position.set(400, 22.5, 400);
        scene.add(monster);

        scene.add(new THREE.AmbientLight(0xffffff, 1.4));
        const light = new THREE.DirectionalLight(0xffffff, 0.4);
        light.position.set(0, 95, 0); scene.add(light);

        camera.position.set(0, 12, 0);
        const keysPressed = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('keydown', e => keysPressed[e.code] = true);
        document.addEventListener('keyup', e => keysPressed[e.code] = false);
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        const ray = new THREE.Raycaster();

        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(4.5, 4.5, 4.5));
            for(let i=0; i<walls.length; i++) {
                if(playerBox.intersectsBox(walls[i])) return true;
            }
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);
            frameCount++;

            // SLIDING COLLISION LOGIC
            const moveDir = new THREE.Vector3();
            if (keysPressed.KeyW) moveDir.z -= 1; if (keysPressed.KeyS) moveDir.z += 1;
            if (keysPressed.KeyA) moveDir.x -= 1; if (keysPressed.KeyD) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.applyQuaternion(camera.quaternion);
                moveDir.y = 0;
                moveDir.normalize().multiplyScalar(keysPressed.ShiftLeft ? 3.5 : 1.8);

                // Check X independently
                const nextX = camera.position.clone().add(new THREE.Vector3(moveDir.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                // Check Z independently
                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveDir.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;
            }

            // OPTIMIZED KEY COLLECTION
            for(let i = keys.length - 1; i >= 0; i--) {
                if(camera.position.distanceTo(keys[i].position) < 12) {
                    const k = keys.splice(i, 1)[0];
                    scene.remove(k);
                    keysCollected++;
                    document.getElementById('count').innerText = keysCollected;
                    
                    if(keysCollected >= 10) {
                        isEnding = true;
                        window.location.href = "level21.html";
                        return;
                    }
                }
            }

            // OPTIMIZED MONSTER VISION (Throttled to every 3rd frame)
            const mPos = monster.position;
            const pPos = camera.position;
            const dist = mPos.distanceTo(pPos);

            if(frameCount % 3 === 0 && dist < 700) {
                ray.set(mPos, new THREE.Vector3().subVectors(pPos, mPos).normalize());
                const hits = ray.intersectObjects(scene.children, true);
                if (hits.length > 0 && hits[0].distance >= dist - 10) {
                    monster.userData.canSee = true;
                } else {
                    monster.userData.canSee = false;
                }
            }

            if (monster.userData.canSee) {
                monster.position.add(new THREE.Vector3().subVectors(pPos, mPos).normalize().multiplyScalar(2.7));
                monster.lookAt(pPos.x, 22.5, pPos.z);
            }

            if (dist < 22) {
                isEnding = true;
                document.getElementById('death-screen').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
