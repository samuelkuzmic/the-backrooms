<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 22 - The Ruins</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ccc; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; 
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #700; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 22: THE RUINS<br>SCRAP RECOVERED: <span id="count">0</span>/10</div>
    <div id="death">CONSUMED BY THE RUINS</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1c);
        scene.fog = new THREE.Fog(0x1a1a1c, 1, 180);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const walls = [];
        let items = [];
        let collected = 0;
        let isEnding = false;

        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0xff7700, emissive: 0xff3300, emissiveIntensity: 0.8 });
        const perimeterMat = new THREE.MeshStandardMaterial({ color: 0x080808 });

        // BRIGHT FLASHLIGHT
        const flashlight = new THREE.SpotLight(0xffffff, 120);
        flashlight.angle = Math.PI / 7;
        flashlight.penumbra = 0.4;
        flashlight.decay = 1;
        flashlight.distance = 300;
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        function addBlock(w, h, d, x, z, mat = concreteMat) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, h/2, z);
            scene.add(m);
            walls.push(new THREE.Box3().setFromObject(m));
        }

        // PERIMETER WALL
        addBlock(620, 100, 20, 0, 310, perimeterMat);
        addBlock(620, 100, 20, 0, -310, perimeterMat);
        addBlock(20, 100, 620, 310, 0, perimeterMat);
        addBlock(20, 100, 620, -310, 0, perimeterMat);

        // RUINED PILLARS
        for(let i=-7; i<=7; i++) {
            for(let j=-7; j<=7; j++) {
                if(Math.abs(i)<1 && Math.abs(j)<1) continue;
                const x = i * 42; const z = j * 42;
                if(Math.random() > 0.45) {
                    addBlock(12, Math.random()*45+10, 12, x, z);
                }
            }
        }

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), concreteMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const roof = floor.clone(); roof.position.y = 55; roof.rotation.x = Math.PI/2; scene.add(roof);

        // SCRAP PIPES
        for(let i=0; i<10; i++) {
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 8, 8), pipeMat);
            pipe.add(new THREE.PointLight(0xff4400, 15, 20));
            pipe.position.set((Math.random()-0.5)*550, 2, (Math.random()-0.5)*550);
            pipe.rotation.z = Math.PI/2;
            scene.add(pipe);
            items.push(pipe);
        }

        // THE WRETCH (Logic: Only moves if sees you)
        const monster = new THREE.Group();
        monster.add(new THREE.Mesh(new THREE.BoxGeometry(4, 26, 4), new THREE.MeshBasicMaterial({color: 0x8888aa, wireframe: true})));
        monster.position.set(220, 13, 220);
        monster.userData = { isChasing: false };
        scene.add(monster);

        // AMBIENT LIGHTING
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const skyLight = new THREE.PointLight(0xffffff, 0.6, 600);
        skyLight.position.set(0, 50, 0);
        scene.add(skyLight);

        camera.position.set(0, 12, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        const ray = new THREE.Raycaster();

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(4.5, 4.5, 4.5));
            for(let w of walls) if(pBox.intersectsBox(w)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            // Flicker effect
            if(Math.random() > 0.97) skyLight.intensity = Math.random() * 0.8;

            // Movement (Speed: 1.6)
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;
            if (move.length() > 0) {
                move.applyQuaternion(camera.quaternion);
                move.y = 0;
                move.normalize().multiplyScalar(keys.ShiftLeft ? 2.6 : 1.6);
                const nX = camera.position.clone().add(new THREE.Vector3(move.x, 0, 0));
                if (!checkCollision(nX)) camera.position.x = nX.x;
                const nZ = camera.position.clone().add(new THREE.Vector3(0, 0, move.z));
                if (!checkCollision(nZ)) camera.position.z = nZ.z;
            }

            // Collection
            for(let i = items.length - 1; i >= 0; i--) {
                if(camera.position.distanceTo(items[i].position) < 15) {
                    scene.remove(items[i]);
                    items.splice(i, 1);
                    collected++;
                    document.getElementById('count').innerText = collected;
                    if(collected >= 10) {
                        isEnding = true;
                        window.location.href = "level23.html";
                        return;
                    }
                }
            }

            // MONSTER LINE OF SIGHT (Same as Level 21)
            const mPos = monster.position;
            const pPos = camera.position;
            const dist = mPos.distanceTo(pPos);
            ray.set(mPos, new THREE.Vector3().subVectors(pPos, mPos).normalize());
            
            const hits = ray.intersectObjects(scene.children, true).filter(o => o.object.parent !== monster);
            const canSee = hits.length > 0 && hits[0].distance >= dist - 2;

            if (canSee && dist < 250) {
                monster.userData.isChasing = true;
            } else {
                monster.userData.isChasing = false; // Stop if vision is broken
            }

            if (monster.userData.isChasing) {
                // Speed: 1.2 (Slower than player)
                monster.position.add(new THREE.Vector3().subVectors(pPos, mPos).normalize().multiplyScalar(1.2));
                monster.lookAt(pPos.x, 13, pPos.z);
            }

            if (dist < 18) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
