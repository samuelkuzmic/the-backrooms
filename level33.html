<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 33 - The Infinite Mall</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0c0c0c; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ff00ff; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 33: THE INFINITE MALL<br>THE FIRE EXIT IS HIDDEN IN A SHOP | FIND THE RED DOOR</div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0c0c);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.15));
        const pLight = new THREE.PointLight(0xffffff, 1.0, 1500);
        scene.add(pLight);

        let isEnding = false;
        const walls = [];
        const entities = [];
        const rooms = [];
        const raycaster = new THREE.Raycaster();

        const mallWidth = 1600;
        const mallLength = 6000;
        const h = 400;

        function addWall(x, z, w, d, color = 0x2a2a2a) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color: color}));
            b.position.set(x, h/2, z);
            scene.add(b);
            const box = new THREE.Box3().setFromObject(b);
            walls.push({box: box, mesh: b});
            return b;
        }

        // --- ENCLOSING MALL BOX ---
        addWall(0, mallLength/2, mallWidth, 40);  // Back
        addWall(0, -mallLength/2, mallWidth, 40); // Front
        addWall(mallWidth/2, 0, 40, mallLength);  // Right
        addWall(-mallWidth/2, 0, 40, mallLength); // Left

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(mallWidth, mallLength), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // --- ROOM GENERATOR ---
        function createShop(x, z, w, d, side) {
            const wallCol = 0x252525;
            // Shop Interior Walls
            addWall(x, z - d/2, w, 20, wallCol); // Top
            addWall(x, z + d/2, w, 20, wallCol); // Bottom
            
            // Entrance Wall (the wall facing the main hall)
            const entX = side === "left" ? x + w/2 : x - w/2;
            addWall(entX, z - d/3, 20, d/3, wallCol);
            addWall(entX, z + d/3, 20, d/3, wallCol);
            
            // Doorway header
            const header = new THREE.Mesh(new THREE.BoxGeometry(20, 150, d/3), new THREE.MeshStandardMaterial({color: wallCol}));
            header.position.set(entX, 325, z);
            scene.add(header);
            walls.push({box: new THREE.Box3().setFromObject(header), mesh: header});

            // Store back wall position for the Exit
            const backWallX = side === "left" ? -mallWidth/2 + 30 : mallWidth/2 - 30;
            rooms.push({x: backWallX, z: z, side: side});
        }

        for (let z = -mallLength/2 + 800; z < mallLength/2 - 800; z += 1000) {
            createShop(-mallWidth/2 + 250, z, 500, 700, "left");
            createShop(mallWidth/2 - 250, z, 500, 700, "right");
        }

        // --- RANDOMIZED FIRE EXIT ---
        const luckyRoom = rooms[Math.floor(Math.random() * rooms.length)];
        const fireDoor = new THREE.Mesh(
            new THREE.BoxGeometry(10, 200, 100), 
            new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0x550000})
        );
        // Positioned flush against the back wall of the chosen shop
        fireDoor.position.set(luckyRoom.x, 100, luckyRoom.z);
        scene.add(fireDoor);
        const exitBox = new THREE.Box3().setFromObject(fireDoor);

        // --- FACELINGS ---
        function spawnFaceling() {
            let z = (Math.random() - 0.5) * (mallLength - 1000);
            if (Math.abs(z) < 600) z += 1200; 
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.CapsuleGeometry(8, 22), new THREE.MeshStandardMaterial({color: 0x1a1a3a})));
            const hd = new THREE.Mesh(new THREE.SphereGeometry(10), new THREE.MeshStandardMaterial({color: 0x9c8163}));
            hd.position.y = 20; g.add(hd);
            g.position.set((Math.random()-0.5)*500, 22, z);
            scene.add(g);
            entities.push(g);
        }
        for(let i=0; i<5; i++) spawnFaceling();

        // --- ENGINE ---
        camera.position.set(0, 45, 0);
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(30, 30, 30));
            for(let w of walls) if(pBox.intersectsBox(w.box)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);
            pLight.position.copy(camera.position);

            const speed = keys.ShiftLeft ? 15.0 : 7.5;
            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;

            if (dir.length() > 0) {
                dir.normalize().applyQuaternion(camera.quaternion);
                dir.y = 0;
                const next = camera.position.clone().add(dir.multiplyScalar(speed));
                if (!checkCollision(new THREE.Vector3(next.x, camera.position.y, camera.position.z))) camera.position.x = next.x;
                if (!checkCollision(new THREE.Vector3(camera.position.x, camera.position.y, next.z))) camera.position.z = next.z;
            }

            // Exit Check
            const playerBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(60,60,60));
            if (playerBox.intersectsBox(exitBox)) {
                isEnding = true;
                window.location.href = "level34.html";
            }

            entities.forEach(f => {
                const dist = f.position.distanceTo(camera.position);
                const toP = new THREE.Vector3().subVectors(camera.position, f.position).normalize();
                raycaster.set(f.position, toP);
                const hit = raycaster.intersectObjects(walls.map(w => w.mesh));
                
                if (dist < 1000 && (hit.length === 0 || hit[0].distance > dist)) {
                    f.position.add(toP.multiplyScalar(4.7));
                    f.lookAt(camera.position.x, 22, camera.position.z);
                }
                if (dist < 50) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
