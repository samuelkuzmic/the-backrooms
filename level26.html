<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 26 - The White Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #fff; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 26: OTHERWORLDLY INTERIOR<br>FIND THE WHITE CUBE</div>
    <div id="death">GEOMETRY COLLAPSE</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 1, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isEnding = false;
        const walls = [];

        // MATERIALS
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c }); // Beige
        const glitchMat = new THREE.MeshBasicMaterial({ color: 0x0066ff }); // Blue fractures
        const exitMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // THE WHITE CUBE

        // FLOOR (Broken pieces)
        for(let i = -10; i < 10; i++) {
            for(let j = -10; j < 10; j++) {
                if(Math.random() > 0.2) {
                    const plate = new THREE.Mesh(new THREE.BoxGeometry(45, 2, 45), wallMat);
                    plate.position.set(i*50, -1, j*50);
                    scene.add(plate);
                }
            }
        }

        // FLOATING WALLS
        function addFloatWall(x, z) {
            const h = 20 + Math.random() * 60;
            const w = new THREE.Mesh(new THREE.BoxGeometry(10, h, 10), wallMat);
            w.position.set(x, h/2 - 5, z);
            w.rotation.y = Math.random() * Math.PI;
            scene.add(w);
            walls.push(new THREE.Box3().setFromObject(w));
            
            // Blue glow strip
            const strip = new THREE.Mesh(new THREE.BoxGeometry(11, 1, 11), glitchMat);
            strip.position.set(x, h/2, z);
            scene.add(strip);
        }

        for(let i=0; i<60; i++) {
            addFloatWall((Math.random()-0.5)*800, (Math.random()-0.5)*800);
        }

        // THE WHITE CUBE (EXIT)
        const exitPos = { x: (Math.random()-0.5)*700, z: (Math.random()-0.5)*700 };
        const whiteCube = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), exitMat);
        whiteCube.position.set(exitPos.x, 8, exitPos.z);
        scene.add(whiteCube);
        const exitLight = new THREE.PointLight(0xffffff, 500, 100);
        exitLight.position.set(exitPos.x, 8, exitPos.z);
        scene.add(exitLight);

        // MONSTER
        const monster = new THREE.Mesh(new THREE.BoxGeometry(5, 20, 5), new THREE.MeshBasicMaterial({color:0x000000, wireframe:true}));
        monster.position.set(100, 10, 100);
        scene.add(monster);

        // LIGHTS
        scene.add(new THREE.AmbientLight(0x404040, 0.5));
        const blueSun = new THREE.DirectionalLight(0x00ffff, 1);
        blueSun.position.set(1, 1, 1);
        scene.add(blueSun);

        camera.position.set(0, 12, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            // Movement
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;
            
            if (move.length() > 0) {
                move.applyQuaternion(camera.quaternion);
                move.y = 0; move.normalize().multiplyScalar(keys.ShiftLeft ? 3.5 : 1.8);
                camera.position.add(move);
            }

            // Fall off check
            if(camera.position.y < -5) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            // WHITE CUBE ROTATION & EXIT
            whiteCube.rotation.y += 0.02;
            whiteCube.rotation.x += 0.01;
            const distToExit = new THREE.Vector2(camera.position.x, camera.position.z).distanceTo(new THREE.Vector2(exitPos.x, exitPos.z));
            if (distToExit < 8) {
                isEnding = true;
                window.location.href = "level27.html";
            }

            // Monster Follow
            const mDist = monster.position.distanceTo(camera.position);
            if (mDist < 400) {
                monster.position.add(new THREE.Vector3().subVectors(camera.position, monster.position).normalize().multiplyScalar(1.2));
            }
            if (mDist < 12) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
