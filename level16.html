<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 16 - Instant Exit</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #ff00ff; z-index: 10; pointer-events: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">LEVEL 16 - THE COLLAPSING MEMORY<br>TOUCH THE KEY TO EXIT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050005);
        scene.fog = new THREE.Fog(0x050005, 1, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x777733 }); 
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00 });

        const walls = [];
        const monsters = [];

        function createWall(x, z, w, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 20, d), wallMat);
            wall.position.set(x, 10, z);
            scene.add(wall);
            walls.push(new THREE.Box3().setFromObject(wall));
        }

        // GENERATE OPEN MAZE
        for(let i=0; i<6; i++) {
            for(let j=0; j<6; j++) {
                let x = i * 60 - 150;
                let z = -j * 60;
                if (Math.random() > 0.65) createWall(x, z, 45, 2);
                if (Math.random() > 0.65) createWall(x + 20, z - 20, 2, 45);
            }
        }

        // BOUNDARIES
        createWall(0, 50, 400, 2); createWall(0, -350, 400, 2);
        createWall(200, -150, 2, 400); createWall(-200, -150, 2, 400);

        // RANDOMIZED KEY
        const keyGroup = new THREE.Group();
        keyGroup.add(new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.6, 12, 24), keyMat));
        keyGroup.add(new THREE.PointLight(0xffcc00, 40, 80));
        keyGroup.position.set((Math.random() * 260) - 130, 6, (Math.random() * -280) - 20);
        scene.add(keyGroup);

        // 3 ACTIVE MONSTERS
        for(let i=0; i<3; i++) {
            const m = new THREE.Group();
            m.add(new THREE.Mesh(new THREE.CapsuleGeometry(2, 10), new THREE.MeshBasicMaterial({color: 0x000000})));
            m.add(new THREE.Mesh(new THREE.BoxGeometry(6, 16, 6), new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true})));
            m.position.set((Math.random()-0.5)*200, 8, -100 - (i * 100));
            scene.add(m);
            monsters.push(m);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.set(0, 10, 25);
        
        let yaw = 0, pitch = 0, isEnding = false;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function isColliding(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(1, 1, 1));
            for(let wall of walls) if(pBox.intersectsBox(wall)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const moveDir = new THREE.Vector3();
            if (keys.KeyW) moveDir.z -= 1; if (keys.KeyS) moveDir.z += 1;
            if (keys.KeyA) moveDir.x -= 1; if (keys.KeyD) moveDir.x += 1;
            
            if (moveDir.length() > 0) {
                moveDir.applyQuaternion(camera.quaternion);
                moveDir.y = 0;
                moveDir.normalize().multiplyScalar(keys.ShiftLeft ? 1.6 : 0.9);
                
                const nextX = camera.position.clone().add(new THREE.Vector3(moveDir.x, 0, 0));
                if (!isColliding(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveDir.z));
                if (!isColliding(nextZ)) camera.position.z = nextZ.z;
            }

            // MONSTER AI
            monsters.forEach(m => {
                const d = camera.position.distanceTo(m.position);
                if (d < 100) {
                    const dir = new THREE.Vector3().subVectors(camera.position, m.position).normalize();
                    m.position.add(dir.multiplyScalar(0.75));
                    m.lookAt(camera.position.x, 8, camera.position.z);
                }
                if (d < 8) location.reload(); // Instant death
            });

            // INSTANT TP EXIT
            if (camera.position.distanceTo(keyGroup.position) < 8) {
                isEnding = true;
                window.location.href = "level17.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
