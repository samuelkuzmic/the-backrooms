<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Level 0</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffff00; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; text-shadow: 2px 2px #000;
        }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: red; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 0<br>FIND THE WHITE CUBE TO ESCAPE</div>
    <div id="death-screen">CAUGHT</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const CHUNK_SIZE = 24;
        const R_DIST = 2; 
        const WALL_H = 4.0;
        const P_RAD = 0.75; 
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const chunks = new Map();
        const keys = {};
        let yaw = 0, pitch = 0;
        let isDead = false;

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x9e8e4a, roughness: 0.8 });
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x3d361c, roughness: 1 });
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0xddddcc });

        // MODIFICATION: Set AmbientLight to high intensity (1.5) for full brightness
        // Also kept the PointLight so the textures still have some definition
        const mainLight = new THREE.PointLight(0xffffcc, 45, 30);
        const brightAmbient = new THREE.AmbientLight(0xffffff, 1.5); 
        scene.add(mainLight, brightAmbient);

        const monsters = [];
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0x221100, wireframe: true });

        function createChunk(cx, cz) {
            const group = new THREE.Group();
            group.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
            
            const f = new THREE.Mesh(new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE), carpetMat);
            f.rotation.x = -Math.PI/2;
            const c = new THREE.Mesh(new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE), ceilMat);
            c.rotation.x = Math.PI/2; c.position.y = WALL_H;
            group.add(f, c);

            for(let x = -1; x <= 1; x++) {
                for(let z = -1; z <= 1; z++) {
                    const l = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.2), new THREE.MeshBasicMaterial({color:0xffffff}));
                    l.position.set(x*8, WALL_H - 0.05, z*8);
                    group.add(l);
                }
            }

            const seed = (cx * 123) + (cz * 456);
            for(let i=0; i<6; i++) {
                const rng = Math.abs(Math.sin(seed + i));
                const wall = new THREE.Mesh(new THREE.BoxGeometry(rng * 7 + 4, WALL_H, 1.5), wallMat);
                wall.position.set(Math.sin(seed+i)*8, WALL_H/2, Math.cos(seed+i)*8);
                wall.rotation.y = rng > 0.5 ? 0 : Math.PI/2;
                group.add(wall);
            }

            if (Math.random() > 0.92 && (cx !== 0 || cz !== 0)) {
                const exitGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                const exitMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const exitBox = new THREE.Mesh(exitGeo, exitMat);
                exitBox.position.set(Math.random() * 16 - 8, 1, Math.random() * 16 - 8);
                exitBox.name = "LevelExit";
                const exitLight = new THREE.PointLight(0xffffff, 10, 5);
                exitBox.add(exitLight);
                group.add(exitBox);
            }

            if (Math.random() > 0.80 && (Math.abs(cx) > 0 || Math.abs(cz) > 0)) {
                const monster = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 2.4, 4, 8), monsterMat);
                monster.position.set(Math.random() * 10 - 5, 1.2, Math.random() * 10 - 5);
                group.add(monster);
                monsters.push({ mesh: monster, chunkKey: `${cx},${cz}` });
            }

            scene.add(group);
            return group;
        }

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;
        camera.position.set(0, 1.7, 5);

        const pBox = new THREE.Box3();
        const wBox = new THREE.Box3();

        function checkCollision(pos) {
            pBox.setFromCenterAndSize(pos, new THREE.Vector3(P_RAD, 1.8, P_RAD));
            let hit = false;
            scene.traverse((obj) => {
                if (obj.isMesh && obj.material === wallMat) {
                    wBox.setFromObject(obj);
                    if (pBox.intersectsBox(wBox)) hit = true;
                }
            });
            return hit;
        }

        function die() {
            if (isDead) return;
            isDead = true;
            document.getElementById('death-screen').style.display = 'flex';
            setTimeout(() => {
                isDead = false;
                document.getElementById('death-screen').style.display = 'none';
                location.reload();
            }, 1500);
        }

        function update() {
            requestAnimationFrame(update);
            if (isDead) return;

            if (document.pointerLockElement) {
                const speed = keys['ShiftLeft'] ? 0.24 : 0.13;
                const move = new THREE.Vector3();
                if (keys['KeyW']) move.z -= 1;
                if (keys['KeyS']) move.z += 1;
                if (keys['KeyA']) move.x -= 1;
                if (keys['KeyD']) move.x += 1;

                if (move.length() > 0) {
                    move.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const oldX = camera.position.x;
                    camera.position.x += move.x * speed;
                    if(checkCollision(camera.position)) camera.position.x = oldX;
                    const oldZ = camera.position.z;
                    camera.position.z += move.z * speed;
                    if(checkCollision(camera.position)) camera.position.z = oldZ;
                }
            }

            monsters.forEach((m) => {
                const worldPos = new THREE.Vector3();
                m.mesh.getWorldPosition(worldPos);
                const dist = camera.position.distanceTo(worldPos);

                if (dist < 20) { 
                    const dir = new THREE.Vector3().subVectors(camera.position, worldPos).normalize();
                    m.mesh.position.x += dir.x * 0.18;
                    m.mesh.position.z += dir.z * 0.18;
                }
                
                if (dist < 1.1) { 
                    die();
                }
            });

            scene.traverse((obj) => {
                if (obj.name === "LevelExit") {
                    const worldPos = new THREE.Vector3();
                    obj.getWorldPosition(worldPos);
                    if (camera.position.distanceTo(worldPos) < 1.5) {
                        window.location.href = "level1.html"; 
                    }
                }
            });

            mainLight.position.copy(camera.position);

            const cx = Math.floor(camera.position.x / CHUNK_SIZE);
            const cz = Math.floor(camera.position.z / CHUNK_SIZE);
            
            for(let x = cx - R_DIST; x <= cx + R_DIST; x++) {
                for(let z = cz - R_DIST; z <= cz + R_DIST; z++) {
                    const key = `${x},${z}`;
                    if(!chunks.has(key)) chunks.set(key, createChunk(x, z));
                }
            }

            if(chunks.size > 20) {
                for (const [key, group] of chunks) {
                    const [kx, kz] = key.split(',').map(Number);
                    if (Math.abs(kx - cx) > R_DIST || Math.abs(kz - cz) > R_DIST) {
                        for (let i = monsters.length - 1; i >= 0; i--) {
                            if (monsters[i].chunkKey === key) monsters.splice(i, 1);
                        }
                        scene.remove(group);
                        chunks.delete(key);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
