<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #1a1a1a; font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center; color: #d1c18d;
        }
        #background-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -1; filter: blur(5px) brightness(0.3);
            background: linear-gradient(45deg, #2c2918, #000000);
        }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 500; background: #000; }
        #game-frame { width: 100%; height: 100%; border: none; }
        
        #hud-container {
            position: fixed; top: 20px; right: 20px;
            text-align: right; z-index: 3000;
        }
        #user-display {
            color: #ffd700; font-size: 0.9rem; text-shadow: 0 0 5px #000;
            letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase;
        }
        #timer-display {
            color: #ffd700; font-family: 'Courier New', monospace;
            font-size: 1.8rem; display: none;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); font-weight: bold;
        }

        .menu-container {
            text-align: center; z-index: 1; padding: 40px; background: rgba(0, 0, 0, 0.7);
            border: 1px solid #3d3a2a; box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        h1 { font-size: 4rem; margin-bottom: 10px; letter-spacing: 15px; animation: flicker 4s infinite; }
        
        .creator-subtitle { 
            font-size: 0.8rem; 
            letter-spacing: 5px; 
            margin-bottom: 50px; 
            color: #ffd700; 
            opacity: 0.8;
            text-transform: uppercase;
        }

        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        button {
            background: transparent; color: #d1c18d; border: 1px solid #d1c18d;
            padding: 12px 50px; font-size: 1.1rem; cursor: pointer;
            transition: all 0.1s ease; width: 320px; text-transform: uppercase; letter-spacing: 3px;
        }
        button:hover { background: #d1c18d; color: #000; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 600; flex-direction: column;
            align-items: center; padding: 50px; box-sizing: border-box;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #3d3a2a; border: 1px solid #d1c18d; }

        #review-list, #records-list, .level-grid, #lobby-members { 
            width: 100%; max-width: 800px; margin-top: 20px; text-align: left; 
            flex-grow: 1; overflow-y: auto; padding-right: 15px;
            border-top: 1px solid #3d3a2a; border-bottom: 1px solid #3d3a2a;
        }

        .level-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            padding: 20px; 
            justify-content: center;
        }
        /* Fix: Added min-width and removed fixed width so long numbers stretch the box */
        .level-box { 
            border: 1px solid #d1c18d; 
            padding: 15px; 
            text-align: center; 
            color: #d1c18d; 
            cursor: pointer; 
            min-width: 60px; 
            white-space: nowrap;
            flex-grow: 0;
        }
        .level-box:hover { background: #d1c18d; color: #000; }

        .login-box {
            background: #000; padding: 30px; border: 1px solid #d1c18d;
            display: flex; flex-direction: column; gap: 15px; width: 320px;
        }
        .login-box input, .login-box select, #review-text {
            background: #000; border: 1px solid #d1c18d;
            color: #d1c18d; padding: 10px; font-family: inherit;
        }

        .lobby-member-item { 
            padding: 15px; border-bottom: 1px solid #3d3a2a; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 215, 0, 0.05); margin-bottom: 5px;
        }
        .status-dot { width: 10px; height: 10px; background: #0f0; border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 8px #0f0; }
        .creator-tag { color: #ffd700; font-size: 0.7rem; border: 1px solid #ffd700; padding: 2px 8px; }
        #lobby-code-display { font-size: 1.8rem; color: #ffd700; margin: 10px 0; border: 1px dashed #ffd700; padding: 15px; letter-spacing: 8px;}

        @keyframes flicker { 0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: 0.7; } }
        .crt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03)); background-size: 100% 3px, 3px 100%; }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <div id="hud-container">
        <div id="user-display">NOT LOGGED IN</div>
        <div id="timer-display">00:00:00</div>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src=""></iframe>
        <button onclick="location.reload()" style="position:fixed; bottom:20px; right:20px; width:auto; z-index:1001; font-size:0.7rem; padding:5px 15px;">QUIT TO MENU</button>
    </div>

    <div id="background-video"></div>

    <div class="menu-container" id="main-menu">
        <h1>THE BACKROOMS</h1>
        <div class="creator-subtitle">CREATED BY SAMMYKUZMIC</div>
        <div class="btn-group">
            <button onclick="openModeSetup('single')">SINGLEPLAYER</button>
            <button onclick="openModeSetup('multi')">MULTIPLAYER</button>
            <button onclick="openModal('login-modal')">LOGIN / REGISTER</button>
            <button onclick="openModal('records-modal')">RECORDS</button>
            <button onclick="openModal('settings-modal')">SETTINGS</button>
            <button onclick="openModal('review-modal')">REVIEWS</button>
            <button onclick="quitGame()">Quit</button>
        </div>
    </div>

    <div id="lobby-gui-modal" class="modal">
        <div id="lobby-code-display">ADDR: <span id="lobby-code-val">------</span></div>
        <h2 style="letter-spacing: 5px;">ACTIVE ENTITIES (LIVE)</h2>
        <div id="lobby-members"></div>
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <button id="creator-start-btn" style="display:none;" onclick="startMultiplayerSession()">START SESSION</button>
            <div id="client-wait-msg" style="color: #ffd700; font-size: 1.2rem; font-weight: bold; display:none;">STARTING...</div>
            <button onclick="location.reload()">LEAVE LOBBY</button>
        </div>
    </div>

    <div id="multi-hub-modal" class="modal">
        <h2>MULTIPLAYER HUB</h2>
        <div class="login-box">
            <button onclick="startLobbyCreation()">CREATE LOBBY</button>
            <div style="margin: 5px 0;">OR</div>
            <input type="text" id="join-input-addr" placeholder="ENTER ADDRESS">
            <button id="join-btn-final" onclick="executeJoinByAddr()">JOIN BY ADDRESS</button>
        </div>
        <button onclick="closeModal('multi-hub-modal')" style="margin-top:20px; width:auto;">BACK</button>
    </div>

    <div id="difficulty-modal" class="modal">
        <h2>SETUP SESSION</h2>
        <div class="btn-group">
            <button onclick="setDifficulty('easy')">EASY</button>
            <button onclick="setDifficulty('medium')">MEDIUM</button>
            <button onclick="setDifficulty('hard')">HARD</button>
        </div>
        <div id="launch-options" style="display:none; flex-direction: column; gap: 15px; align-items: center; margin-top:20px;">
            <div style="color:#ffd700">NODE: <span id="node-setup-val">level0.html</span></div>
            <button onclick="handleLaunch()">START GAME</button>
            <button onclick="openModal('level-select-modal')">LEVEL SELECTION</button>
        </div>
        <button onclick="closeModal('difficulty-modal')" style="margin-top:20px; width:auto;">BACK</button>
    </div>

    <div id="login-modal" class="modal">
        <h2>IDENTITY AUTH</h2>
        <div class="login-box">
            <input type="text" id="username-input" placeholder="USERNAME">
            <input type="password" id="password-input" placeholder="PASSWORD">
            <button onclick="handleAuth('login')">LOGIN</button>
            <button onclick="handleAuth('register')" style="font-size:0.6rem; border:none; text-decoration:underline;">CREATE NEW IDENTITY</button>
            <div id="auth-status" style="color:#ffd700; font-size:0.8rem; text-align:center; min-height:15px;"></div>
        </div>
        <button onclick="closeModal('login-modal')" style="margin-top:20px; width:auto;">BACK</button>
    </div>

    <div id="level-select-modal" class="modal"><h2>NODES</h2><div class="level-grid" id="grid"></div><button onclick="closeModal('level-select-modal')" style="margin-top:20px; width:auto;">BACK</button></div>
    <div id="records-modal" class="modal"><h2>ARCHIVE</h2><div id="records-list"></div><button onclick="closeModal('records-modal')" style="margin-top:20px; width:auto;">BACK</button></div>
    
    <div id="review-modal" class="modal">
        <h2>LOGS</h2>
        <div class="login-box" style="width:400px;">
            <select id="r-stars">
                <option value="5">★★★★★</option>
                <option value="4">★★★★☆</option>
                <option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="1">★☆☆☆☆</option>
            </select>
            <textarea id="review-text" placeholder="Report..." rows="2"></textarea>
            <button onclick="addReview()" style="width: 100%; box-sizing: border-box;">POST</button>
        </div>
        <div id="review-list"></div>
        <button onclick="closeModal('review-modal')" style="margin-top:20px; width:auto;">BACK</button>
    </div>
    
    <div id="settings-modal" class="modal"><h2>SYSTEM</h2><div class="login-box"><label>SPEEDRUN TIMER: <input type="checkbox" id="speedrun-check" onchange="toggleSpeedrun(this.checked)"></label><button onclick="localStorage.clear(); location.reload();">WIPE DATA</button></div><button onclick="closeModal('settings-modal')" style="margin-top:20px; width:auto;">BACK</button></div>

    <script>
        const BIN_ID = '69dece1136566621a8b3c9bc'; 
        const API_KEY = '$2a$10$T9OUbgye3uPezpE4FjsjRuyQ6iBlrsMCg5I6LIzuKe.bxlt6ffKZ2';
        const URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

        let currentUser = JSON.parse(localStorage.getItem('br_user')) || null;
        let gameMode = 'single', currentLobbyCode = null, lobbyInterval = null, isCreator = false;
        let selectedLevel = 'level0.html', activeLevelName = '', startTime = 0, timerInterval = null;

        if(currentUser) document.getElementById('user-display').innerText = `USER: ${currentUser.name.toUpperCase()}`;
        document.getElementById('speedrun-check').checked = localStorage.getItem('speedrun') === 'true';

        async function getCloudData() {
            const res = await fetch(URL + "/latest?nocache=" + Date.now(), { headers: { 'X-Access-Key': API_KEY, 'X-Bin-Meta': 'false' } });
            const d = await res.json(); return d.record ? d.record : d;
        }

        async function updateCloudData(data) {
            await fetch(URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Access-Key': API_KEY }, body: JSON.stringify(data) });
        }

        function stopSpeedrunTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                console.log("Timer Stopped.");
            }
        }

        function startTimer() {
            if(localStorage.getItem('speedrun') !== 'true') return;
            startTime = Date.now();
            document.getElementById('timer-display').style.display = 'block';
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const m = Math.floor(elapsed / 60000).toString().padStart(2, '0');
                const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const ms = Math.floor((elapsed % 1000) / 10).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${m}:${s}:${ms}`;
            }, 10);
        }

        async function handleLaunch() {
            if(gameMode === 'single') { startTimer(); return launchLevel(selectedLevel); }
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentLobbyCode = code; isCreator = true;
            document.getElementById('lobby-code-val').innerText = code;
            document.getElementById('creator-start-btn').style.display = 'block';
            closeModal('difficulty-modal'); closeModal('multi-hub-modal'); openModal('lobby-gui-modal');
            let data = await getCloudData();
            if(!data.lobbies) data.lobbies = {};
            data.lobbies[code] = { members: [{name: currentUser.name, role: 'creator'}], started: false, level: selectedLevel };
            await updateCloudData(data);
            lobbyInterval = setInterval(syncLobby, 1000); 
        }

        async function executeJoinByAddr() {
            const addr = document.getElementById('join-input-addr').value.toUpperCase().trim();
            if(!addr) return;
            const data = await getCloudData(); 
            if (data.lobbies && data.lobbies[addr]) {
                currentLobbyCode = addr; isCreator = false;
                data.lobbies[addr].members.push({name: currentUser.name, role: 'member'});
                await updateCloudData(data);
                document.getElementById('lobby-code-val').innerText = addr;
                closeModal('multi-hub-modal'); openModal('lobby-gui-modal');
                lobbyInterval = setInterval(syncLobby, 1000);
            }
        }

        async function syncLobby() {
            if (!currentLobbyCode) return;
            const data = await getCloudData();
            const lobby = data.lobbies[currentLobbyCode];
            if (!lobby) return;
            if(lobby.started && activeLevelName !== lobby.level) {
                if(activeLevelName === '') startTimer();
                launchLevel(lobby.level);
            }
            document.getElementById('lobby-members').innerHTML = lobby.members.map(m => `
                <div class="lobby-member-item"><span><div class="status-dot"></div>${m.name.toUpperCase()}</span>${m.role === 'creator' ? '<span class="creator-tag">HOST</span>' : ''}</div>
            `).join('');
        }

        async function startMultiplayerSession() {
            let data = await getCloudData();
            if(data.lobbies[currentLobbyCode]) {
                data.lobbies[currentLobbyCode].started = true;
                await updateCloudData(data);
            }
        }

        function launchLevel(url) {
            if(url.toLowerCase().includes("theend.html")) { stopSpeedrunTimer(); }
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('game-frame').src = url;
            activeLevelName = url;
        }

        async function handleAuth(type) {
            const u = document.getElementById('username-input').value.trim();
            const p = document.getElementById('password-input').value.trim();
            const status = document.getElementById('auth-status');
            if(!u || !p) return;
            let data = await getCloudData();
            if(type === 'register') {
                if(data.users.find(x => x.name.toLowerCase() === u.toLowerCase())) { status.innerText = "ACCOUNT TAKEN"; return; }
                data.users.push({name:u, pass:p}); await updateCloudData(data); status.innerText = "ACCOUNT CREATED";
            } else {
                const ex = data.users.find(x => x.name.toLowerCase() === u.toLowerCase() && x.pass === p);
                if(ex) { localStorage.setItem('br_user', JSON.stringify({name:ex.name})); location.reload(); }
                else { status.innerText = "INVALID CREDENTIALS"; }
            }
        }

        function updateGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            [...Array(51).keys(), "188", "!", "9223372036854775807"].forEach(l => {
                const a = document.createElement('div'); a.className = 'level-box'; a.innerText = l;
                a.onclick = () => { 
                    selectedLevel = l === "!" ? "level!.html" : l === "9223372036854775807" ? "level9223372036854775807.html" : `level${l}.html`; 
                    document.getElementById('node-setup-val').innerText = selectedLevel; 
                    closeModal('level-select-modal'); 
                };
                grid.appendChild(a);
            });
        }

        async function addReview() {
            const t = document.getElementById('review-text').value; const s = document.getElementById('r-stars').value;
            if(!t) return;
            let data = await getCloudData();
            if(!data.reviews) data.reviews = [];
            data.reviews.push({stars: parseInt(s), text: t});
            await updateCloudData(data); fetchReviews(); document.getElementById('review-text').value = "";
        }
        async function fetchReviews() {
            const d = await getCloudData();
            document.getElementById('review-list').innerHTML = (d.reviews || []).slice().reverse().map(r => `<div style="border-bottom: 1px solid #3d3a2a; padding: 10px 0;"><div style="color:#ffd700;">${"★".repeat(r.stars)}</div><div>${r.text}</div></div>`).join('');
        }
        async function fetchRecords() {
            const d = await getCloudData();
            document.getElementById('records-list').innerHTML = (d.records || []).slice().reverse().map(r => `<div style="border-bottom: 1px solid #3d3a2a; padding: 10px 0;"><span style="color:#ffd700;">${r.name}</span> - ${r.time}</div>`).join('');
        }

        function openModal(id) { if(id === 'review-modal') fetchReviews(); if(id === 'records-modal') fetchRecords(); if(id === 'level-select-modal') updateGrid(); document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openModeSetup(m) { gameMode = m; if(m==='multi' && !currentUser) return openModal('login-modal'); openModal(m==='multi' ? 'multi-hub-modal' : 'difficulty-modal'); }
        function setDifficulty(d) { sessionStorage.setItem('br_difficulty', d); document.getElementById('launch-options').style.display='flex'; }
        function toggleSpeedrun(v) { localStorage.setItem('speedrun', v); }
        function startLobbyCreation() { closeModal('multi-hub-modal'); openModal('difficulty-modal'); }
        
        function quitGame() { 
            if (window.process && window.process.type === 'renderer' || window.require) {
                const { ipcRenderer } = require('electron');
                ipcRenderer.send('quit-app');
            } else {
                window.close(); 
            }
        }
    </script>
</body>
</html>
