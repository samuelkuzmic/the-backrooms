<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 44 - Bright Corroded Maze</title>
    <style>
        body { margin: 0; overflow: hidden; background: #3d2b1f; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffcc00; z-index: 10; font-size: 1.1rem; 
            pointer-events: none; text-shadow: 1px 1px #000; 
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #f00; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 44: CORRODED RETAIL (BRIGHT)<br>FIND THE EXIT TO LEVEL 45</div>
    <div id="death">DISSOLVED BY RUST</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8c6d46);
        scene.fog = new THREE.Fog(0x8c6d46, 10, 600);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- MATERIALS ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x6e4b2d, roughness: 0.8 }); 
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a3219, roughness: 1 }); 
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1f }); 

        const obstacles = [];
        const entities = [];
        let isEnding = false;

        function addBox(w, h, d, x, y, z, mat, collidable = true) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, y, z);
            scene.add(m);
            if (collidable) obstacles.push(new THREE.Box3().setFromObject(m));
            return m;
        }

        // --- WORLD PARAMETERS ---
        const GRID_SIZE = 14; 
        const CELL_SIZE = 60;
        const MAP_WIDTH = GRID_SIZE * CELL_SIZE;

        // BOXING THE ENTIRE PLACE IN
        addBox(MAP_WIDTH, 2, MAP_WIDTH, 0, -1, 0, floorMat, false); // Floor
        addBox(MAP_WIDTH, 2, MAP_WIDTH, 0, 40, 0, ceilMat, true);  // Roof

        // MAZE GENERATION
        for(let i = -GRID_SIZE/2; i <= GRID_SIZE/2; i++) {
            for(let j = -GRID_SIZE/2; j <= GRID_SIZE/2; j++) {
                const x = i * CELL_SIZE;
                const z = j * CELL_SIZE;

                // Perimeter Walls
                if (Math.abs(i) === GRID_SIZE/2 || Math.abs(j) === GRID_SIZE/2) {
                    addBox(CELL_SIZE, 40, CELL_SIZE, x, 20, z, wallMat);
                } 
                // Internal Walls
                else if (Math.random() > 0.7 && (Math.abs(i) > 1 || Math.abs(j) > 1)) {
                    const wallWidth = Math.random() > 0.5 ? CELL_SIZE : 15;
                    const wallDepth = wallWidth === 15 ? CELL_SIZE : 15;
                    addBox(wallWidth, 40, wallDepth, x, 20, z, wallMat);
                }
            }
        }

        // --- MONSTERS: SPAWN AWAY FROM PLAYER ---
        function createMonster(type) {
            const group = new THREE.Group();
            if(type === 'smiler') {
                const mat = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Black eyes in bright room
                const mouth = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.1), mat);
                const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.1), mat);
                eye1.position.set(-0.6, 0.8, 0);
                const eye2 = eye1.clone(); eye2.position.x = 0.6;
                group.add(mouth, eye1, eye2);
                group.userData = { speed: 0.6 };
            } else {
                const body = new THREE.Mesh(new THREE.BoxGeometry(4, 18, 4), new THREE.MeshStandardMaterial({color: 0x8c7b60}));
                group.add(body);
                group.userData = { speed: 0.3 };
            }
            
            let sx, sz, distToPlayer;
            do {
                sx = (Math.random() - 0.5) * (MAP_WIDTH - 120);
                sz = (Math.random() - 0.5) * (MAP_WIDTH - 120);
                distToPlayer = Math.sqrt(sx*sx + sz*sz);
            } while (distToPlayer < 250); // SAFE ZONE: Won't spawn within 250 units
            
            group.position.set(sx, 12, sz);
            scene.add(group);
            entities.push(group);
        }

        for(let i=0; i<30; i++) createMonster('smiler');
        for(let i=0; i<15; i++) createMonster('faceling');

        // --- EXIT ---
        const exitX = (Math.random() - 0.5) * (MAP_WIDTH - 150);
        const exitZ = (Math.random() - 0.5) * (MAP_WIDTH - 150);
        const elevator = addBox(20, 38, 20, exitX, 19, exitZ, new THREE.MeshStandardMaterial({color: 0x00ff00, emissive: 0x00ff00}));

        // --- BRIGHT AMBIENT LIGHTING ---
        const ambient = new THREE.AmbientLight(0xffffff, 1.5); // Very bright fill
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(1, 1, 1);
        scene.add(sun);

        // --- PLAYER CONTROLS ---
        camera.position.set(0, 15, 0);
        const keys = {};
        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(8, 15, 8));
            for(let box of obstacles) if(pBox.intersectsBox(box)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 1.2 : 0.7;
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;

            if (move.length() > 0) {
                move.normalize().applyQuaternion(camera.quaternion);
                move.y = 0;
                const nextPos = camera.position.clone();
                nextPos.x += move.x * speed;
                if (!checkCollision(nextPos)) camera.position.x = nextPos.x;
                nextPos.z += move.z * speed;
                if (!checkCollision(nextPos)) camera.position.z = nextPos.z;
            }

            entities.forEach(ent => {
                const dist = ent.position.distanceTo(camera.position);
                ent.lookAt(camera.position);
                if(dist < 300) {
                    const dir = new THREE.Vector3().subVectors(camera.position, ent.position).normalize();
                    ent.position.add(dir.multiplyScalar(ent.userData.speed));
                }
                if(dist < 12) {
                    isEnding = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            if(camera.position.distanceTo(elevator.position) < 25) {
                isEnding = true;
                window.location.href = "level45.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
