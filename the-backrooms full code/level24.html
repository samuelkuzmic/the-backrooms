<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 24 - The Moon</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #fff; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; 
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #fff; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 24: THE MOON<br>OBJECTIVE: FIND THE LUNAR PIT</div>
    <div id="death">OXYGEN DEPLETED</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 1, 400);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const walls = [];
        let isEnding = false;

        // PHYSICS
        let velocityY = 0;
        let isGrounded = true;
        const gravity = -0.008; 

        // MATERIALS
        const moonMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 1 });
        const pitMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        // THE LANDSCAPE
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), moonMat);
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // THE PIT (The Exit)
        const pitPos = { x: (Math.random()-0.5)*1200, z: (Math.random()-0.5)*1200 };
        const pitGeo = new THREE.CircleGeometry(40, 32);
        const pit = new THREE.Mesh(pitGeo, pitMat);
        pit.rotation.x = -Math.PI/2;
        pit.position.set(pitPos.x, 0.1, pitPos.z);
        scene.add(pit);

        // LUNAR ROCKS
        function addRock(size, x, z) {
            const m = new THREE.Mesh(new THREE.DodecahedronGeometry(size), moonMat);
            m.position.set(x, size/2, z);
            m.rotation.set(Math.random(), Math.random(), Math.random());
            scene.add(m);
            walls.push(new THREE.Box3().setFromObject(m));
        }
        for(let i=0; i<100; i++) {
            const rx = (Math.random()-0.5)*2000;
            const rz = (Math.random()-0.5)*2000;
            // Don't place rocks inside the pit
            if(Math.sqrt(Math.pow(rx-pitPos.x,2) + Math.pow(rz-pitPos.z,2)) > 60) {
                addRock(Math.random()*10+2, rx, rz);
            }
        }

        // MONSTER (Deathmoth Variant)
        const monster = new THREE.Group();
        monster.add(new THREE.Mesh(new THREE.BoxGeometry(6, 2, 8), new THREE.MeshBasicMaterial({color: 0x222222, wireframe: true})));
        monster.position.set(150, 20, 150);
        monster.userData = { chasing: false };
        scene.add(monster);

        // LIGHTING
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 100, 50);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.05));

        camera.position.set(0, 10, 0);
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => {
            keys[e.code] = true;
            if(e.code === 'Space' && isGrounded) {
                velocityY = 0.35;
                isGrounded = false;
            }
        };
        window.onkeyup = e => keys[e.code] = false;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isEnding) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        const ray = new THREE.Raycaster();

        function checkCollision(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(4, 4, 4));
            for(let w of walls) if(pBox.intersectsBox(w)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            // Lunar Gravity
            velocityY += gravity;
            camera.position.y += velocityY;
            if(camera.position.y <= 10) {
                camera.position.y = 10;
                velocityY = 0;
                isGrounded = true;
            }

            // Movement (Floaty Speed)
            const move = new THREE.Vector3();
            if (keys.KeyW) move.z -= 1; if (keys.KeyS) move.z += 1;
            if (keys.KeyA) move.x -= 1; if (keys.KeyD) move.x += 1;
            if (move.length() > 0) {
                move.applyQuaternion(camera.quaternion);
                move.y = 0;
                move.normalize().multiplyScalar(keys.ShiftLeft ? 2.0 : 1.2);
                const nX = camera.position.clone().add(new THREE.Vector3(move.x, 0, 0));
                if (!checkCollision(nX)) camera.position.x = nX.x;
                const nZ = camera.position.clone().add(new THREE.Vector3(0, 0, move.z));
                if (!checkCollision(nZ)) camera.position.z = nZ.z;
            }

            // PIT DETECTION (Exit)
            const distToPit = new THREE.Vector2(camera.position.x, camera.position.z).distanceTo(new THREE.Vector2(pitPos.x, pitPos.z));
            if (distToPit < 35 && camera.position.y <= 10.5) {
                isEnding = true;
                window.location.href = "level25.html";
                return;
            }

            // Monster AI
            const mPos = monster.position;
            const pPos = camera.position;
            const dist = mPos.distanceTo(pPos);
            ray.set(mPos, new THREE.Vector3().subVectors(pPos, mPos).normalize());
            const hits = ray.intersectObjects(scene.children, true).filter(o => o.object.parent !== monster);
            
            if (hits.length > 0 && hits[0].distance >= dist - 5 && dist < 400) {
                monster.userData.chasing = true;
            } else {
                monster.userData.chasing = false;
            }

            if (monster.userData.chasing) {
                monster.position.add(new THREE.Vector3().subVectors(pPos, mPos).normalize().multiplyScalar(0.9));
                monster.lookAt(pPos.x, pPos.y, pPos.z);
            }

            if (dist < 15) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 1500);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
