<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 18 - Memories</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #ffffff; z-index: 10; pointer-events: none; font-weight: bold; text-shadow: 2px 2px #ff00ff; }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #ff3300; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 18 - THE DAYCARE<br>MAP ENCLOSED</div>
    <div id="overlay">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a202a);
        scene.fog = new THREE.Fog(0x2a202a, 10, 350); // Slightly increased fog for the bigger walls

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const blockColors = [0xff5555, 0x5555ff, 0xffcc44, 0x55ff55];
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xeeeecc });

        const walls = [];
        const monsters = [];
        let isEnding = false;

        function createToyBlock(x, z, w, h, d) {
            const color = blockColors[Math.floor(Math.random() * blockColors.length)];
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            block.position.set(x, h/2, z);
            scene.add(block);
            walls.push(new THREE.Box3().setFromObject(block));
        }

        // --- BOUNDARY WALLS ---
        // North
        createToyBlock(0, 600, 1200, 60, 20);
        // South
        createToyBlock(0, -600, 1200, 60, 20);
        // East
        createToyBlock(600, 0, 20, 60, 1200);
        // West
        createToyBlock(-600, 0, 20, 60, 1200);

        // RANDOM INTERIOR BLOCKS
        const spacing = 75;
        for(let i = -7; i <= 7; i++) {
            for(let j = -7; j <= 7; j++) {
                let x = i * spacing;
                let z = j * spacing;
                // Don't spawn on player start
                if (Math.abs(x) < 50 && Math.abs(z) < 50) continue; 
                if (Math.random() > 0.5) createToyBlock(x, z, 30, 45, 30);
            }
        }

        // FLOOR & ROOF
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), floorMat);
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), roofMat);
        roof.position.y = 45; roof.rotation.x = Math.PI/2; scene.add(roof);

        // EXIT (Music Box)
        const exitX = (Math.random() > 0.5 ? 1 : -1) * (300 + Math.random() * 100);
        const exitZ = (Math.random() > 0.5 ? 1 : -1) * (300 + Math.random() * 100);
        const exit = new THREE.Group();
        exit.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({color: 0xff00ff})));
        exit.add(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2000), new THREE.MeshBasicMaterial({color: 0xffcc00, transparent: true, opacity: 0.5})));
        exit.position.set(exitX, 6, exitZ);
        scene.add(exit);

        // MONSTERS
        for(let i = 0; i < 3; i++) {
            const m = new THREE.Group();
            m.add(new THREE.Mesh(new THREE.CapsuleGeometry(3, 10), new THREE.MeshBasicMaterial({color: 0x000000})));
            m.position.set(-200, 6, 200 - (i*80));
            scene.add(m);
            monsters.push(m);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pLight = new THREE.PointLight(0xffffff, 100, 200);
        camera.add(pLight);
        scene.add(camera);

        camera.position.set(0, 15, 0);
        let yaw = 0, pitch = 0;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0;
                dir.normalize().multiplyScalar(keys.ShiftLeft ? 3.0 : 1.6);
                
                const nextX = camera.position.clone().add(new THREE.Vector3(dir.x, 0, 0));
                let hitX = false;
                const bX = new THREE.Box3().setFromCenterAndSize(nextX, new THREE.Vector3(3,3,3));
                for(let w of walls) if(bX.intersectsBox(w)) hitX = true;
                if(!hitX) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, dir.z));
                let hitZ = false;
                const bZ = new THREE.Box3().setFromCenterAndSize(nextZ, new THREE.Vector3(3,3,3));
                for(let w of walls) if(bZ.intersectsBox(w)) hitZ = true;
                if(!hitZ) camera.position.z = nextZ.z;
            }

            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if (dist < 400) {
                    m.position.add(new THREE.Vector3().subVectors(camera.position, m.position).normalize().multiplyScalar(1.3));
                    m.lookAt(camera.position.x, 6, camera.position.z);
                }
                if (dist < 15) {
                    isEnding = true;
                    document.getElementById('overlay').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            if (camera.position.distanceTo(exit.position) < 20) {
                isEnding = true;
                window.location.href = "level19.html";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
