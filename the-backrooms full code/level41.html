<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 41 - The Black Lake</title>
    <style>
        body { margin: 0; overflow: hidden; background: #002; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffaa00; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; 
        }
        #alert-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 3.5rem; font-weight: bold; display: none; z-index: 50;
            text-shadow: 0 0 20px #000; pointer-events: none; text-align: center;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #f00; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 41: THE BLACK LAKE<br>STATUS: HEAVY ROWING | FIND THE WHITE BOX</div>
    <div id="alert-box"></div>
    <div id="death">CAUGHT BY THE DEEP</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 100, 3500); // Fog adjusted for bigger map

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const moon = new THREE.DirectionalLight(0xccccff, 1.5);
        moon.position.set(1000, 2000, 1000);
        scene.add(moon);
        scene.add(new THREE.AmbientLight(0x101025, 0.5));

        // --- THE BOAT ---
        const boat = new THREE.Group();
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.9 });
        
        // Wood Texture
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#3d2b1f'; ctx.fillRect(0,0,64,64);
        ctx.strokeStyle = '#24180d'; ctx.lineWidth = 4;
        for(let i=0; i<64; i+=16) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(64, i); ctx.stroke(); }
        woodMat.map = new THREE.CanvasTexture(canvas);

        const hull = new THREE.Mesh(new THREE.BoxGeometry(15, 2, 30), woodMat);
        boat.add(hull);

        const createBWall = (w, h, d, x, y, z) => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodMat);
            wall.position.set(x, y, z);
            boat.add(wall);
        };
        createBWall(1, 6, 30, 7.5, 3, 0); createBWall(1, 6, 30, -7.5, 3, 0);
        createBWall(15, 6, 1, 0, 3, 15); createBWall(15, 6, 1, 0, 3, -15);

        boat.position.set(0, 1, 0);
        scene.add(boat);

        const cameraHolder = new THREE.Group();
        cameraHolder.position.y = 7;
        boat.add(cameraHolder);
        cameraHolder.add(camera);

        // --- MASSIVE LAKE & WALLS ---
        const limit = 5000; // MAP IS NOW TWICE AS BIG
        const water = new THREE.Mesh(new THREE.PlaneGeometry(limit*2, limit*2), new THREE.MeshStandardMaterial({ color: 0x000208, metalness: 0.8, roughness: 0.2 }));
        water.rotation.x = -Math.PI/2;
        scene.add(water);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
        const addP = (w, h, d, x, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, h/2, z); scene.add(m);
        };
        addP(limit*2, 600, 100, 0, limit); addP(limit*2, 600, 100, 0, -limit);
        addP(100, 600, limit*2, limit, 0); addP(100, 600, limit*2, -limit, 0);

        // --- RANDOMIZED EXIT SPAWN ---
        // Generates a position far away from (0,0)
        function getRandomExit() {
            const sideX = Math.random() > 0.5 ? 1 : -1;
            const sideZ = Math.random() > 0.5 ? 1 : -1;
            const x = (limit - 500 - (Math.random() * 1000)) * sideX;
            const z = (limit - 500 - (Math.random() * 1000)) * sideZ;
            return new THREE.Vector3(x, 20, z);
        }

        const exitPos = getRandomExit();
        const exitBox = new THREE.Mesh(new THREE.BoxGeometry(80, 80, 80), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        exitBox.position.copy(exitPos);
        scene.add(exitBox);
        
        const exitLight = new THREE.PointLight(0xffffff, 200, 1000);
        exitLight.position.copy(exitPos);
        scene.add(exitLight);

        // --- GAME LOGIC ---
        let velocity = 0;
        let isEnding = false;
        let isFrozen = false;
        const keys = {};
        const alertBox = document.getElementById('alert-box');

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                cameraHolder.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-0.8, Math.min(0.8, camera.rotation.x - e.movementY * 0.002));
            }
        });

        function triggerSequence() {
            if(isEnding) return;
            setTimeout(() => {
                alertBox.style.display = "block"; alertBox.style.color = "#ffff00";
                alertBox.innerText = "3";
                setTimeout(() => {
                    alertBox.innerText = "2";
                    setTimeout(() => {
                        alertBox.innerText = "1";
                        setTimeout(() => {
                            isFrozen = true;
                            alertBox.style.color = "#ff0000";
                            alertBox.innerText = "STAY STILL";
                            setTimeout(() => {
                                isFrozen = false;
                                alertBox.style.display = "none";
                                triggerSequence();
                            }, 4500);
                        }, 1000);
                    }, 1000);
                }, 1000);
            }, 8000 + Math.random() * 10000);
        }
        triggerSequence();

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const isInputting = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD;

            // Kill Condition
            if (isFrozen && isInputting) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            // --- SLOWER ROWING PHYSICS ---
            const rowPower = 0.04; // Much slower acceleration
            const turnSpeed = 0.015; // Slower turning
            const waterFriction = 0.99; // Retains drift longer

            if (keys.KeyW) velocity -= rowPower;
            if (keys.KeyS) velocity += rowPower;
            if (keys.KeyA) boat.rotation.y += turnSpeed;
            if (keys.KeyD) boat.rotation.y -= turnSpeed;

            velocity *= waterFriction;
            const moveVec = new THREE.Vector3(0, 0, velocity).applyQuaternion(boat.quaternion);
            boat.position.add(moveVec);

            // Bounce off outer walls
            if (Math.abs(boat.position.x) > limit - 100 || Math.abs(boat.position.z) > limit - 100) {
                velocity *= -0.2;
            }

            // Exit Check
            if (boat.position.distanceTo(exitPos) < 120) {
                isEnding = true;
                window.location.href = "level42.html"; 
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
