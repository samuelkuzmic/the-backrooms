<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 17 - The Carrier Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffff; z-index: 10; pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 4rem; z-index: 100; color: #ff3300; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 17 - THE CARRIER<br>OBJECTIVE: LOCATE THE GREEN BEACON</div>
    <div id="overlay">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a10);
        scene.fog = new THREE.Fog(0x050a10, 100, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6 });
        const cyanMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        const walls = [];
        const monsters = [];
        let isEnding = false;

        function createWall(x, z, w, d, isBoundary = false) {
            const h = isBoundary ? 60 : 40;
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, h/2, z);
            scene.add(wall);
            
            const strip = new THREE.Mesh(new THREE.BoxGeometry(w+1, 1.5, d+1), cyanMat);
            strip.position.set(x, 15, z);
            scene.add(strip);

            walls.push(new THREE.Box3().setFromObject(wall));
        }

        // 1. GENERATE WALLS FIRST
        const spacing = 100;
        for(let i = -6; i <= 6; i++) {
            for(let j = -6; j <= 6; j++) {
                let x = i * spacing;
                let z = j * spacing;
                if (Math.abs(x) < 80 && Math.abs(z) < 80) continue; 
                if (Math.random() > 0.45) createWall(x, z - spacing/2, spacing, 10);
                if (Math.random() > 0.45) createWall(x - spacing/2, z, 10, spacing);
            }
        }

        createWall(0, 650, 1300, 20, true);
        createWall(0, -650, 1300, 20, true);
        createWall(650, 0, 20, 1300, true);
        createWall(-650, 0, 20, 1300, true);

        // 2. DEFINE SAFE SPAWN LOGIC
        function findSafePos() {
            let pos = new THREE.Vector3();
            let attempts = 0;
            while(attempts < 100) {
                // Pick a random spot far from spawn
                pos.set((Math.random() - 0.5) * 1000, 10, (Math.random() - 0.5) * 1000);
                
                // Create a test hitbox (25 units wide to ensure it's not touching walls)
                let testBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(25, 40, 25));
                let hitWall = false;
                for(let w of walls) {
                    if(testBox.intersectsBox(w)) { hitWall = true; break; }
                }
                
                if(!hitWall) return pos;
                attempts++;
            }
            return new THREE.Vector3(400, 10, 400); // Absolute fallback
        }

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1300, 1300), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(1300, 1300), new THREE.MeshStandardMaterial({color: 0x222222, side: THREE.DoubleSide}));
        roof.rotation.x = Math.PI/2; roof.position.y = 40; scene.add(roof);

        // 3. SPAWN BEACON
        const exit = new THREE.Group();
        const consoleMesh = new THREE.Mesh(new THREE.BoxGeometry(15, 20, 15), new THREE.MeshBasicMaterial({color: 0x00ff00}));
        const beacon = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 3000), new THREE.MeshBasicMaterial({color: 0x00ff00}));
        const eLight = new THREE.PointLight(0x00ff00, 1000, 500); 
        exit.add(consoleMesh, beacon, eLight);
        
        const safeExitPos = findSafePos();
        exit.position.copy(safeExitPos);
        scene.add(exit);

        // 4. SPAWN MONSTERS
        for(let i = 0; i < 3; i++) {
            const m = new THREE.Group();
            m.add(new THREE.Mesh(new THREE.CapsuleGeometry(3, 12), new THREE.MeshBasicMaterial({color: 0x000000})));
            m.add(new THREE.Mesh(new THREE.BoxGeometry(12, 24, 12), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true})));
            const ml = new THREE.PointLight(0xff0000, 150, 100);
            m.add(ml);
            
            const safeMPos = findSafePos();
            m.position.copy(safeMPos);
            scene.add(m);
            monsters.push(m);
        }

        scene.add(new THREE.AmbientLight(0x00ffff, 0.6));
        const pLight = new THREE.PointLight(0xffffff, 150, 200);
        camera.add(pLight);
        scene.add(camera);

        camera.position.set(0, 15, 0);
        let yaw = 0, pitch = 0;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (keys.KeyW) dir.z -= 1; if (keys.KeyS) dir.z += 1;
            if (keys.KeyA) dir.x -= 1; if (keys.KeyD) dir.x += 1;
            if (dir.length() > 0) {
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0;
                dir.normalize().multiplyScalar(keys.ShiftLeft ? 3.5 : 1.8);
                
                const nextX = camera.position.clone().add(new THREE.Vector3(dir.x, 0, 0));
                const bX = new THREE.Box3().setFromCenterAndSize(nextX, new THREE.Vector3(4,4,4));
                let hitX = false;
                for(let w of walls) if(bX.intersectsBox(w)) hitX = true;
                if(!hitX) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, dir.z));
                const bZ = new THREE.Box3().setFromCenterAndSize(nextZ, new THREE.Vector3(4,4,4));
                let hitZ = false;
                for(let w of walls) if(bZ.intersectsBox(w)) hitZ = true;
                if(!hitZ) camera.position.z = nextZ.z;
            }

            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if (dist < 400) {
                    m.position.add(new THREE.Vector3().subVectors(camera.position, m.position).normalize().multiplyScalar(1.4));
                    m.lookAt(camera.position.x, 12, camera.position.z);
                }
                if (dist < 18) {
                    isEnding = true;
                    document.getElementById('overlay').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            if (camera.position.distanceTo(exit.position) < 30) {
                isEnding = true;
                window.location.href = "level18.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
