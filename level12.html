<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 12 - The Matrix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #000; z-index: 10; pointer-events: none; font-weight: bold; }
        #glitch { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 255, 0, 0.3); display: none; z-index: 5; pointer-events: none; }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 2.5rem; z-index: 100; color: #f00; background: #000;
            text-align: center; padding: 20px;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 12<br>FIND THE ANOMALY</div>
    <div id="glitch"></div>
    <div id="overlay"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        // Adjusted fog for longer distance search
        scene.fog = new THREE.Fog(0xffffff, 50, 800);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // FLOOR - Larger grid for longer travel
        const grid = new THREE.GridHelper(5000, 150, 0x000000, 0x000000);
        scene.add(grid);

        // MONSTER
        const monster = new THREE.Group();
        const mMat = new THREE.MeshBasicMaterial({color: 0xffffff});
        const mWire = new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true});
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(2, 8, 4, 8), mMat);
        const shell = new THREE.Mesh(new THREE.CapsuleGeometry(2.1, 8.1, 4, 8), mWire);
        monster.add(body, shell);
        monster.position.set(0, 4, -100);
        scene.add(monster);

        // ANOMALY (Farther & Randomly Spawned)
        const anomaly = new THREE.Mesh(
            new THREE.BoxGeometry(10, 10, 10), 
            new THREE.MeshBasicMaterial({color: 0x000000})
        );
        
        // Random Angle and Random Far Distance (400 to 700 units)
        const randomAngle = Math.random() * Math.PI * 2;
        const randomDist = 400 + Math.random() * 300;
        anomaly.position.set(
            Math.cos(randomAngle) * randomDist, 
            5, 
            Math.sin(randomAngle) * randomDist
        );
        scene.add(anomaly);

        camera.position.set(0, 10, 20);
        let yaw = 0, pitch = 0, stareTime = 0, isEnding = false;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        const frustum = new THREE.Frustum();
        const matrix = new THREE.Matrix4();

        function die() {
            isEnding = true;
            const el = document.getElementById('overlay');
            el.style.display = 'flex';
            el.innerText = "YOUR EXISTENCE HAS BEEN RECURSIVELY DELETED.";
            setTimeout(() => location.reload(), 4000);
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const moveDir = new THREE.Vector3();
            if (keys.KeyW) moveDir.z -= 1; if (keys.KeyS) moveDir.z += 1;
            if (keys.KeyA) moveDir.x -= 1; if (keys.KeyD) moveDir.x += 1;
            if (moveDir.length() > 0) {
                moveDir.applyQuaternion(camera.quaternion);
                moveDir.y = 0;
                camera.position.add(moveDir.normalize().multiplyScalar(1.5)); // Slightly faster movement
            }

            matrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(matrix);
            
            if (frustum.intersectsObject(body)) {
                stareTime += 0.016;
                document.getElementById('glitch').style.display = 'block';
                document.getElementById('glitch').style.opacity = stareTime / 5;
                
                const shakeAmount = (stareTime / 5) * 0.6;
                camera.position.x += (Math.random() - 0.5) * shakeAmount;
                camera.position.y += (Math.random() - 0.5) * shakeAmount;
            } else {
                stareTime = Math.max(0, stareTime - 0.05);
                document.getElementById('glitch').style.display = 'none';
                
                const dist = camera.position.distanceTo(monster.position);
                if (dist > 40) {
                    const follow = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                    monster.position.add(follow.multiplyScalar(1.1));
                }
            }

            if (stareTime > 5) die();
            
            if (camera.position.distanceTo(anomaly.position) < 15) {
                window.location.href = "level13.html";
            }

            anomaly.rotation.y += 0.05;
            anomaly.rotation.x += 0.02;
            monster.lookAt(camera.position.x, 4, camera.position.z);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
