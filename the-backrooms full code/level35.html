<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 35 - The Parking Lot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010103; font-family: 'Courier New', monospace; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffcc00; z-index: 10; font-size: 1.2rem; 
            pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000;
        }
        #death { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 5rem; z-index: 100; color: #ff0000; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 35: THE PARKING LOT<br>FIND THE TALL BOX</div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const MAP_SIZE = 18000; 
        scene.fog = new THREE.Fog(0x010103, 100, 7000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 25000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x050510, 0.4));

        // --- GROUND & PARKING LINES ---
        const floorGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,512,512);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 492, 492); 
        const lineTex = new THREE.CanvasTexture(canvas);
        lineTex.repeat.set(60, 60); lineTex.wrapS = lineTex.wrapT = THREE.RepeatWrapping;
        floor.material.map = lineTex;

        // --- THE WALLS ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
        const addWall = (w, h, d, x, z, rot = 0) => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, h/2, z);
            wall.rotation.y = rot;
            scene.add(wall);
        };
        addWall(MAP_SIZE, 1500, 200, 0, MAP_SIZE/2);
        addWall(MAP_SIZE, 1500, 200, 0, -MAP_SIZE/2);
        addWall(MAP_SIZE, 1500, 200, MAP_SIZE/2, 0, Math.PI/2);
        addWall(MAP_SIZE, 1500, 200, -MAP_SIZE/2, 0, Math.PI/2);

        // --- LAMPS ---
        function createLamp(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 700), wallMat);
            pole.position.set(x, 350, z);
            const head = new THREE.Mesh(new THREE.BoxGeometry(120, 20, 60), wallMat);
            head.position.set(x, 700, z);
            const light = new THREE.PointLight(0xffccaa, 1.5, 3000, 1.7);
            light.position.set(x, 680, z);
            light.intensity = 2000000;
            scene.add(pole, head, light);
        }
        for(let x = -MAP_SIZE/2 + 3000; x < MAP_SIZE/2; x += 4000) {
            for(let z = -MAP_SIZE/2 + 3000; z < MAP_SIZE/2; z += 4000) {
                createLamp(x, z);
            }
        }

        // --- RANDOMIZED STAIRWELL ---
        const stairwell = new THREE.Group();
        const mainBody = new THREE.Mesh(new THREE.BoxGeometry(450, 1000, 450), new THREE.MeshStandardMaterial({color: 0x111111}));
        mainBody.position.y = 500;
        const door = new THREE.Mesh(new THREE.BoxGeometry(120, 220, 20), new THREE.MeshStandardMaterial({color: 0x221100}));
        door.position.set(0, 110, 226);
        stairwell.add(mainBody, door);

        const rx = (Math.random() - 0.5) * (MAP_SIZE - 2000);
        const rz = (Math.random() - 0.5) * (MAP_SIZE - 2000);
        stairwell.position.set(rx, 0, rz);
        scene.add(stairwell);
        const exitBox = new THREE.Box3().setFromObject(stairwell);

        // --- MONSTER ---
        const entity = new THREE.Mesh(new THREE.CapsuleGeometry(25, 60), new THREE.MeshStandardMaterial({color: 0xd2b48c}));
        entity.position.set(-MAP_SIZE/3, 60, -MAP_SIZE/3);
        scene.add(entity);

        // --- ENGINE (NON-ICE MOVEMENT) ---
        camera.position.set(0, 110, 0);
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x - e.movementY * 0.002));
            }
        });
        camera.rotation.order = 'YXZ';

        let isEnding = false;
        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const speed = keys.ShiftLeft ? 30.0 : 15.0;
            const moveVec = new THREE.Vector3();
            if (keys.KeyW) moveVec.z -= 1; if (keys.KeyS) moveVec.z += 1;
            if (keys.KeyA) moveVec.x -= 1; if (keys.KeyD) moveVec.x += 1;

            if (moveVec.length() > 0) {
                moveVec.normalize().applyQuaternion(camera.quaternion);
                moveVec.y = 0;
                
                const nextX = camera.position.x + (moveVec.x * speed);
                const nextZ = camera.position.z + (moveVec.z * speed);

                // Boundary logic
                if (Math.abs(nextX) < MAP_SIZE/2 - 200) camera.position.x = nextX;
                if (Math.abs(nextZ) < MAP_SIZE/2 - 200) camera.position.z = nextZ;
            }
            
            camera.position.y = 110; // Static height, no bob

            // Exit Check
            if (new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(150,200,150)).intersectsBox(exitBox)) {
                isEnding = true;
                window.location.href = "level36.html";
            }

            // Entity Chase
            const d = entity.position.distanceTo(camera.position);
            entity.position.add(new THREE.Vector3().subVectors(camera.position, entity.position).normalize().multiplyScalar(9.5));
            entity.lookAt(camera.position.x, 60, camera.position.z);

            if (d < 110) {
                isEnding = true;
                document.getElementById('death').style.display = 'flex';
                setTimeout(() => location.reload(), 2000);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
