<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 14 - The Military Hospital</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #008888; z-index: 10; pointer-events: none; font-weight: bold; }
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; align-items: center; justify-content: center; 
            font-size: 3rem; z-index: 100; color: #f00; background: #000;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 14 - THE MILITARY HOSPITAL<br>BLUE BEDS FOUND: <span id="count">0</span>/4</div>
    <div id="overlay">CAUGHT.</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const bedMat = new THREE.MeshStandardMaterial({ color: 0x555555 });

        const walls = [];
        const interactiveBeds = [];
        const monsters = [];
        let bedsFound = 0;

        function createWall(x, y, z, w, h, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, y, z);
            scene.add(wall);
            walls.push(new THREE.Box3().setFromObject(wall));
        }

        function createBed(x, z, isSpecial) {
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 10), isSpecial ? new THREE.MeshBasicMaterial({color: 0x00ffff}) : bedMat);
            frame.position.y = 3;
            group.add(frame);
            if(isSpecial) {
                const l = new THREE.PointLight(0x00ffff, 20, 30);
                l.position.y = 5;
                group.add(l);
                interactiveBeds.push(group);
            }
            group.position.set(x, 0, z);
            scene.add(group);
            walls.push(new THREE.Box3().setFromObject(group));
        }

        // GENERATE WARD MAZE
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 8; j++) {
                let x = i * 60 - 150;
                let z = -j * 60;
                createWall(x - 20, 10, z, 20, 20, 2);
                createWall(x + 20, 10, z, 20, 20, 2);

                if (Math.random() > 0.4) {
                    const roomX = x + (Math.random() > 0.5 ? 25 : -25);
                    const roomZ = z - 25;
                    createWall(roomX, 10, roomZ - 10, 20, 20, 2); 
                    const special = (interactiveBeds.length < 4 && Math.random() > 0.6);
                    createBed(roomX, roomZ, special);
                }
            }
        }
        
        // Ensure exactly 4 special beds exist
        while(interactiveBeds.length < 4) {
            createBed((Math.random()-0.5)*200, -Math.random()*400, true);
        }

        // OUTER BOUNDARIES
        createWall(0, 10, 50, 600, 30, 5); 
        createWall(0, 10, -520, 600, 30, 5);
        createWall(200, 10, -225, 5, 30, 600);
        createWall(-200, 10, -225, 5, 30, 600);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), floorMat);
        floor.rotation.x = -Math.PI/2; floor.position.set(0,0,-225); scene.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), wallMat);
        roof.rotation.x = Math.PI/2; roof.position.set(0,20,-225); scene.add(roof);

        // MONSTERS (REDUCED COUNT)
        for(let i=0; i<2; i++) {
            const m = new THREE.Group();
            m.add(new THREE.Mesh(new THREE.CapsuleGeometry(2, 10, 4, 8), new THREE.MeshBasicMaterial({color: 0xffffff})));
            m.add(new THREE.Mesh(new THREE.BoxGeometry(5.2, 15.2, 5.2), new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true})));
            m.position.set((Math.random()-0.5)*100, 7.5, -200 - (i * 100));
            scene.add(m);
            monsters.push(m);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        camera.position.set(0, 9, 20);
        let yaw = 0, pitch = 0, isEnding = false;
        const keys = {};

        document.addEventListener('mousedown', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !isEnding) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                camera.rotation.set(Math.max(-1.5, Math.min(1.5, pitch)), yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        function checkCollision(pos) {
            let pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(2.5, 2.5, 2.5));
            for(let wall of walls) if(pBox.intersectsBox(wall)) return true;
            return false;
        }

        function animate() {
            if (isEnding) return;
            requestAnimationFrame(animate);

            const moveDir = new THREE.Vector3();
            if (keys.KeyW) moveDir.z -= 1; if (keys.KeyS) moveDir.z += 1;
            if (keys.KeyA) moveDir.x -= 1; if (keys.KeyD) moveDir.x += 1;
            
            if (moveDir.length() > 0) {
                moveDir.applyQuaternion(camera.quaternion); moveDir.y = 0;
                let speed = keys.ShiftLeft ? 1.4 : 0.7;
                moveDir.normalize().multiplyScalar(speed);
                
                const nextX = camera.position.clone().add(new THREE.Vector3(moveDir.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveDir.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;
            }

            // BED COLLECTION LOGIC
            for(let i = interactiveBeds.length - 1; i >= 0; i--) {
                const bed = interactiveBeds[i];
                if(camera.position.distanceTo(bed.position) < 12) {
                    interactiveBeds.splice(i, 1);
                    bedsFound++;
                    document.getElementById('count').innerText = bedsFound;
                    scene.remove(bed);
                    
                    // WIN CONDITION
                    if (bedsFound >= 4) {
                        isEnding = true;
                        window.location.href = "level15.html";
                        return;
                    }
                }
            }

            // MONSTER AI
            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if (dist < 150) m.position.add(new THREE.Vector3().subVectors(camera.position, m.position).normalize().multiplyScalar(0.72));
                m.lookAt(camera.position.x, 7.5, camera.position.z);
                if (dist < 8) {
                    isEnding = true;
                    document.getElementById('overlay').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
