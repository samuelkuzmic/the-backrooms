<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Backrooms - Level 8</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            color: #ffffff; font-family: 'Courier New', monospace; 
            pointer-events: none; z-index: 100; font-weight: bold;
            text-shadow: 2px 2px #000;
        }
        #death {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; z-index: 1000;
            color: #f00; font-family: 'Courier New', monospace;
            align-items: center; justify-content: center;
            font-size: 3rem; letter-spacing: 20px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">LEVEL 8 - CAVE SYSTEM<br>FIND THE WHITE BOX</div>
    <div id="death">CAUGHT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 20, 250); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isDead = false;
        const collidables = [];
        const monsters = [];

        // --- ULTRA BRIGHT SEARCHLIGHT ---
        const flashLight = new THREE.SpotLight(0xffffff, 1200);
        flashLight.angle = Math.PI / 3;
        flashLight.distance = 500; 
        scene.add(flashLight);
        scene.add(flashLight.target);

        const areaLight = new THREE.PointLight(0xffffff, 25, 100);
        scene.add(areaLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.25); 

        const caveMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

        // --- THE ENVIRONMENT ---
        const size = 600; 

        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), caveMat);
        floor.rotation.x = -Math.PI/2; 
        scene.add(floor);

        // THE ROOF (Placed at Y=40, above all rocks)
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(size, size), caveMat);
        roof.rotation.x = Math.PI/2; 
        roof.position.y = 40; 
        scene.add(roof);

        function addBlockyRock(x, z, baseScale) {
            if (Math.sqrt(x*x + z*z) < 50) return; 

            const group = new THREE.Group();
            const layers = 3 + Math.floor(Math.random() * 4);
            for(let i = 0; i < layers; i++) {
                const s = baseScale * (1 - (i * 0.15));
                const part = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), caveMat);
                // Stacking them up
                part.position.set((Math.random()-0.5)*4, i*s, (Math.random()-0.5)*4);
                group.add(part);
            }
            group.position.set(x, 0, z);
            scene.add(group);
            collidables.push(new THREE.Box3().setFromObject(group));
        }

        // Boundary Walls to prevent falling out
        const wallH = 40;
        const wallG = new THREE.BoxGeometry(size, wallH, 10);
        const wallN = new THREE.Mesh(wallG, caveMat); wallN.position.set(0, wallH/2, size/2); scene.add(wallN); collidables.push(new THREE.Box3().setFromObject(wallN));
        const wallS = new THREE.Mesh(wallG, caveMat); wallS.position.set(0, wallH/2, -size/2); scene.add(wallS); collidables.push(new THREE.Box3().setFromObject(wallS));
        const wallE = new THREE.Mesh(wallG, caveMat); wallE.rotation.y = Math.PI/2; wallE.position.set(size/2, wallH/2, 0); scene.add(wallE); collidables.push(new THREE.Box3().setFromObject(wallE));
        const wallW = new THREE.Mesh(wallG, caveMat); wallW.rotation.y = Math.PI/2; wallW.position.set(-size/2, wallH/2, 0); scene.add(wallW); collidables.push(new THREE.Box3().setFromObject(wallW));

        // Generate the cave interior
        for(let i = 0; i < 140; i++) {
            addBlockyRock((Math.random()-0.5)*(size-50), (Math.random()-0.5)*(size-50), 10 + Math.random()*15);
        }

        // --- EXIT ---
        const exitBox = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        exitBox.position.set((Math.random()-0.5)*500, 4, (Math.random()-0.5)*500);
        scene.add(exitBox);
        const exitGlow = new THREE.PointLight(0xffffff, 150, 200);
        exitGlow.position.copy(exitBox.position);
        scene.add(exitGlow);

        // --- MONSTERS ---
        for(let i = 0; i < 5; i++) {
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1.2, 4, 4, 8), monsterMat);
            let mx, mz;
            do {
                mx = (Math.random()-0.5)*size;
                mz = (Math.random()-0.5)*size;
            } while (Math.sqrt(mx*mx + mz*mz) < 180); 
            m.position.set(mx, 4, mz);
            m.userData = { chasing: false };
            scene.add(m);
            monsters.push(m);
        }

        // --- CONTROLS ---
        let yaw = 0, pitch = 0;
        const keys = {};
        const lock = () => renderer.domElement.requestPointerLock();
        document.addEventListener('mousedown', lock);

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement && !isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        camera.position.set(0, 5, 0);
        const pBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);
            if (isDead) return;

            const speed = keys.ShiftLeft ? 0.42 : 0.22;
            const moveVec = new THREE.Vector3();
            if (keys.KeyW) moveVec.z -= 1;
            if (keys.KeyS) moveVec.z += 1;
            if (keys.KeyA) moveVec.x -= 1;
            if (keys.KeyD) moveVec.x += 1;
            
            if (moveVec.length() > 0) {
                moveVec.applyQuaternion(camera.quaternion);
                moveVec.y = 0;
                moveVec.normalize().multiplyScalar(speed);

                const oldPos = camera.position.clone();
                camera.position.x += moveVec.x;
                pBox.setFromCenterAndSize(camera.position, new THREE.Vector3(1.8, 5, 1.8));
                for(let box of collidables) if(pBox.intersectsBox(box)) camera.position.x = oldPos.x;

                camera.position.z += moveVec.z;
                pBox.setFromCenterAndSize(camera.position, new THREE.Vector3(1.8, 5, 1.8));
                for(let box of collidables) if(pBox.intersectsBox(box)) camera.position.z = oldPos.z;
            }

            flashLight.position.copy(camera.position);
            areaLight.position.copy(camera.position);
            const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
            flashLight.target.position.copy(targetPos);

            monsters.forEach(m => {
                const dist = camera.position.distanceTo(m.position);
                if (dist < 90) m.userData.chasing = true;

                if (m.userData.chasing) {
                    const dir = new THREE.Vector3().subVectors(camera.position, m.position).normalize();
                    const mSpeed = 0.32; // Just below your sprint speed
                    m.position.x += dir.x * mSpeed;
                    m.position.z += dir.z * mSpeed;
                    m.lookAt(camera.position);
                }
                if (dist < 4) {
                    isDead = true;
                    document.getElementById('death').style.display = 'flex';
                    setTimeout(() => location.reload(), 2000);
                }
            });

            if (camera.position.distanceTo(exitBox.position) < 10) {
                window.location.href = "level9.html";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
